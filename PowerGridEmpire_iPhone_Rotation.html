<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d2028"><title>Power Grid Empire — Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#10232b;color:#eaf3f1;font:14px system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none}#world{position:absolute;inset:74px 0 125px;width:100%;height:calc(100% - 199px);touch-action:none;background:linear-gradient(#7397a3,#c2d0c0)}header{position:absolute;top:0;left:0;right:0;height:74px;background:#10232b;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #45616b}header b{font-size:17px}small{color:#a5bdc4}#metrics{text-align:right;font-size:12px;line-height:1.6}#bottom{position:absolute;bottom:0;left:0;right:0;min-height:125px;background:#10232b;padding:9px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #45616b}#status{font-size:12px;color:#b8d4da;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.buttons{display:flex;gap:6px;overflow-x:auto}button{background:#244856;border:1px solid #577987;color:white;border-radius:9px;padding:11px 10px;font-weight:650;white-space:nowrap;font-size:12px}button.active{background:#e2aa4c;color:#10232b}button:disabled{opacity:.35}#notice{position:absolute;top:82px;left:10px;right:10px;text-align:center;background:#142f39dc;border-radius:8px;padding:7px;font-size:12px;pointer-events:none}#detail{position:absolute;bottom:137px;left:10px;right:10px;background:#122e39ec;border:1px solid #53717b;border-radius:10px;padding:9px 12px;font-size:12px;pointer-events:none}#detail strong{color:#ffd080}#help{position:absolute;top:78px;right:9px;font-size:11px;background:#193e48c9;border-radius:6px;padding:5px}</style></head><body><header><div><b>⚡ Power Grid Empire</b><div><small>Meridian Power · East Midlands</small></div></div><div id="metrics"></div></header><canvas id="world"></canvas><div id="notice">Tap a building to inspect · Drag to pan · Pinch to zoom · Twist to rotate</div><div id="help">2026 · M1 Mobile Preview</div><div id="detail"></div><div id="bottom"><div id="status"></div><div class="buttons"><button id="rotleft">↶ Rotate</button><button id="rotright">↷ Rotate</button><button id="run">⏸ Pause</button><button id="speed">⏩ 1×</button><button id="gas">+ Gas £5m</button><button id="battery">+ Battery £3m</button><button id="save">💾 Save</button><button id="reset">↺ Reset</button></div></div><script>
const cv=document.querySelector('#world'),ctx=cv.getContext('2d'),metrics=document.querySelector('#metrics'),status=document.querySelector('#status'),detail=document.querySelector('#detail');let W,H,dpr=1,offsetX=0,offsetY=0,zoom=1,angle=0,drag=false,last=null,pinch=0,build=null,selected=null,paused=false,speeds=[1,3,10,30],speedIdx=0,day=1,hour=8,cash=20,assets=[{type:'OCGT',x:5,y:5,mw:50,name:'Meridian OCGT 1'},{type:'Gas',x:3,y:7,name:'Gas receiving'},{type:'Grid',x:8,y:4,name:'Grid connection'},{type:'Office',x:3,y:3,name:'Control building'}],price=120,earnings=0;const SIZE=14,TW=43,TH=23;const colors={OCGT:'#758a97',Gas:'#c2a874',Grid:'#608e9e',Office:'#567f8f',Battery:'#d0c9a5'};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function rotateXY(x,y){let c=Math.cos(angle),s=Math.sin(angle),cx=SIZE/2,cy=SIZE/2; x-=cx;y-=cy;return {x:x*c-y*s+cx,y:x*s+y*c+cy}}
function iso(x,y,z=0){let q=rotateXY(x,y);return {x:W/2+offsetX+(q.x-q.y)*TW/2*zoom,y:H*.42+offsetY+(q.x+q.y)*TH/2*zoom-z*zoom}}
function polygon(points,fill,stroke='#2e5156'){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
function tile(x,y,color){polygon([iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],color)}
function cube(x,y,w,h,height,color){let a=iso(x,y,height),b=iso(x+w,y,height),c=iso(x+w,y+h,height),d=iso(x,y+h,height),e=iso(x+w,y+h,0),f=iso(x,y+h,0),g=iso(x+w,y,0);polygon([d,c,e,f],'#52616b');polygon([b,c,e,g],'#42535d');polygon([a,b,c,d],color)}
function draw(){ctx.clearRect(0,0,W,H);for(let x=0;x<SIZE;x++)for(let y=0;y<SIZE;y++){let road=x===2||y===8;tile(x,y,road?'#657274':(x+y)%2?'#63866d':'#698b71')}for(let i=0;i<SIZE;i++){let p=iso(i,0);ctx.fillStyle='#e5e3cb';ctx.fillRect(p.x-1,p.y-5,2,5)}let ordered=[...assets].sort((a,b)=>{let p=rotateXY(a.x+1,a.y+1),q=rotateXY(b.x+1,b.y+1);return (p.x+p.y)-(q.x+q.y)});for(let a of ordered){let col=colors[a.type],ht=a.type==='OCGT'?25:a.type==='Grid'?12:10;cube(a.x+.1,a.y+.1,1.7,1.4,ht,col);if(a.type==='OCGT'){let p=iso(a.x+.45,a.y+.45,ht+17);ctx.fillStyle='#8b9ba2';ctx.fillRect(p.x-5,p.y,10,17*zoom)}if(a.type==='Battery'){let p=iso(a.x+.3,a.y+.3,ht+2);ctx.fillStyle='#eef4ee';ctx.fillRect(p.x,p.y,10*zoom,3*zoom)}if(selected===a){let p=iso(a.x+.8,a.y+.8,ht+8);ctx.fillStyle='#ffe39d';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill()}}if(build){ctx.fillStyle='#fff5d8';ctx.font='bold 14px system-ui';ctx.fillText('Tap an empty tile to build '+build,12,25)}requestAnimationFrame(draw)}draw();
function getTile(px,py){let u=(px-W/2-offsetX)/zoom/(TW/2),v=(py-H*.42-offsetY)/zoom/(TH/2);let rx=(u+v)/2,ry=(v-u)/2,c=Math.cos(angle),s=Math.sin(angle),cx=SIZE/2,cy=SIZE/2;rx-=cx;ry-=cy;return {x:Math.floor(rx*c+ry*s+cx),y:Math.floor(-rx*s+ry*c+cy)}}
function choose(px,py){let t=getTile(px,py);if(t.x<0||t.y<0||t.x>=SIZE||t.y>=SIZE)return;let a=assets.find(a=>t.x>=a.x&&t.x<a.x+2&&t.y>=a.y&&t.y<a.y+2);if(build){if(a){message('That location is occupied');return}let cost=build==='OCGT'?5:3;if(cash<cost){message('Insufficient cash');return}cash-=cost;let n={type:build,x:t.x,y:t.y,mw:build==='OCGT'?20:10,name:build==='OCGT'?'20MW gas generator':'10MW / 20MWh battery'};assets.push(n);selected=n;build=null;update();message('Construction complete — '+n.name)}else{selected=a||null;update()}}
let touches=new Map(),moved=false,twist=null;cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false});cv.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let prev=touches.get(e.pointerId);let dx=e.clientX-prev.x,dy=e.clientY-prev.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){offsetX+=dx;offsetY+=dy}else if(touches.size===2){let v=[...touches.values()],dist=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);let theta=Math.atan2(v[1].y-v[0].y,v[1].x-v[0].x);if(pinch)zoom=Math.max(.5,Math.min(2.2,zoom*dist/pinch));if(twist!==null){let delta=theta-twist;delta=Math.atan2(Math.sin(delta),Math.cos(delta));angle+=delta}pinch=dist;twist=theta;moved=true}});cv.addEventListener('pointerup',e=>{if(!moved&&touches.size===1)choose(e.clientX-cv.getBoundingClientRect().left,e.clientY-cv.getBoundingClientRect().top);touches.delete(e.pointerId);pinch=0;twist=null});cv.addEventListener('pointercancel',e=>{touches.delete(e.pointerId);pinch=0;twist=null});
let noteTimeout;function message(t){let n=document.querySelector('#notice');n.textContent=t;clearTimeout(noteTimeout);noteTimeout=setTimeout(()=>n.textContent='Tap a building to inspect · Drag to pan · Pinch to zoom · Twist to rotate',3500)}
function update(){let cap=assets.filter(a=>a.type==='OCGT').reduce((s,a)=>s+a.mw,0),bat=assets.filter(a=>a.type==='Battery').reduce((s,a)=>s+a.mw,0);metrics.innerHTML=`<b>£${cash.toFixed(2)}m</b><br><small>${cap}MW gas · ${bat}MW BESS</small>`;status.textContent=`Day ${day} · ${String(Math.floor(hour)).padStart(2,'0')}:00 · Power £${price}/MWh · Revenue £${earnings.toFixed(2)}m`;detail.innerHTML=selected?`<strong>${selected.name}</strong><br>Type: ${selected.type} · ${selected.mw||'Infrastructure'}${selected.mw?' MW':''} · ${selected.type==='OCGT'?'Simulated automatic dispatch':'Site asset'}`:'<strong>Site overview</strong><br>One operating gas plant. Tap an asset or build an expansion. This is a simplified mobile preview.';document.querySelector('#gas').classList.toggle('active',build==='OCGT');document.querySelector('#battery').classList.toggle('active',build==='Battery')}
function tick(){if(paused)return;hour+=.25*speeds[speedIdx];while(hour>=24){hour-=24;day++}price=Math.max(-20,Math.round(85+48*Math.sin(day*.33+hour*.18)+24*Math.cos(day*.11)));let cap=assets.filter(a=>a.type==='OCGT').reduce((s,a)=>s+a.mw,0);let generated=price>95?cap:0;let profit=generated*Math.max(0,price-85)*.25*speeds[speedIdx]/1e6;cash+=profit;earnings+=profit;update()};setInterval(tick,750);document.querySelector('#rotleft').onclick=()=>{angle-=Math.PI/2;message('Camera rotated left')};document.querySelector('#rotright').onclick=()=>{angle+=Math.PI/2;message('Camera rotated right')};document.querySelector('#run').onclick=()=>{paused=!paused;document.querySelector('#run').textContent=paused?'▶ Resume':'⏸ Pause'};document.querySelector('#speed').onclick=()=>{speedIdx=(speedIdx+1)%speeds.length;document.querySelector('#speed').textContent='⏩ '+speeds[speedIdx]+'×'};document.querySelector('#gas').onclick=()=>{build=build==='OCGT'?null:'OCGT';update();message(build?'Tap an empty tile to place a 20MW gas unit':'Build cancelled')};document.querySelector('#battery').onclick=()=>{build=build==='Battery'?null:'Battery';update();message(build?'Tap an empty tile to place a 10MW battery':'Build cancelled')};document.querySelector('#save').onclick=()=>{localStorage.setItem('pge-mobile-m1',JSON.stringify({assets,cash,day,hour,earnings,angle,zoom,offsetX,offsetY}));message('Saved on this device')};document.querySelector('#reset').onclick=()=>{if(confirm('Reset your game?')){localStorage.removeItem('pge-mobile-m1');location.reload()}};try{let s=JSON.parse(localStorage.getItem('pge-mobile-m1'));if(s){assets=s.assets;cash=s.cash;day=s.day;hour=s.hour;earnings=s.earnings;angle=s.angle||0;zoom=s.zoom||1;offsetX=s.offsetX||0;offsetY=s.offsetY||0}}catch(e){}update();
</script></body></html>
