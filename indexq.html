#panelHead{align-items:flex-start}
#panelTitle{flex:1;min-width:0;overflow-wrap:anywhere}
#panelClose{position:static;flex:0 0 44px;min-height:44px;padding:0}
#businessDesk{--ink:#e7eff0;--soft:#a5babc;--accent:#a7e7c5;--line:#35525a;color:var(--ink);background:#10252d;border:1px solid var(--line);border-radius:21px;padding:0;width:min(740px,calc(100vw - 20px));max-height:min(840px,calc(100dvh - 24px));box-sizing:border-box;box-shadow:0 24px 80px #0008;font:15px/1.45 Inter,system-ui,sans-serif;overflow:auto;overscroll-behavior:contain}
#businessDesk::backdrop{background:#03121ab0}
#businessDesk h2,#businessDesk h3{line-height:1.14}
#businessDesk h3{margin:21px 0 10px;font-size:17px}
#businessDesk p{margin:9px 0;color:var(--soft)}
#deskHeader{position:sticky;top:0;z-index:2;background:#10252df5;border-bottom:1px solid var(--line);padding:10px 16px 0}
.desk-titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.desk-titlebar strong{font-size:15px}
#deskClock{font:12px ui-monospace,monospace;color:#b0c6c7;margin-left:auto;white-space:nowrap}
#deskClose{width:44px;padding:0;font-size:25px;font-weight:400;background:transparent}
#deskNav{display:flex;gap:5px;overflow-x:auto;padding:3px 0 7px}
#businessDesk button{min-height:44px;cursor:pointer;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#1c3941;padding:7px 12px;font-size:13px}
#businessDesk button:focus-visible,#businessDesk input:focus-visible,#businessDesk select:focus-visible{outline:2px solid #f3cc78;outline-offset:2px}
#deskNav button{white-space:nowrap}
#businessDesk button.selected{background:#2c514e;border-color:#8bd1ad;color:#e8ffe8}
#businessDesk button.primary{background:var(--accent);border-color:var(--accent);color:#0d2824;font-weight:750}
#deskBody{padding:16px 16px 4px}
#deskStatus{padding:0 16px 9px;color:#ffcf88!important}
#deskStatus:empty{display:none}
.desk-hero{background:linear-gradient(132deg,#234549,#1b353b 52%,#2e4035);border:1px solid #42645e;border-radius:15px;padding:17px}
.desk-hero small,.price-title span,.desk-metrics small,.investment-grid small{color:#b1c7c8}
.desk-hero h2{font-size:clamp(25px,5.5vw,42px);letter-spacing:-.035em;margin:7px 0}
.desk-heading h2{margin:0;font-size:25px;letter-spacing:-.02em}
.desk-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.desk-metrics article,.investment-grid article{border:1px solid var(--line);background:#162f37;border-radius:11px;padding:10px;min-width:0}
.desk-metrics strong{display:block;font-size:clamp(13px,3.5vw,24px);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.desk-metrics small{display:block;font-size:11px}
.objectives{display:grid;gap:5px}
#businessDesk .objectives button{display:flex;align-items:center;text-align:left;gap:10px}
.objectives span{background:#284b44;color:#b2f4cf;border-radius:50%;display:grid;place-items:center;width:25px;height:25px;flex-shrink:0}
.objectives b{margin-left:auto}
.desk-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#businessDesk label{display:grid;gap:4px;font-size:12px;color:#c4d1d1;min-width:0}
#businessDesk input,#businessDesk select{height:44px;box-sizing:border-box;font-size:16px;background:#1d3c44;color:var(--ink);border:1px solid #52717a;border-radius:8px;padding:5px 8px;width:100%;min-width:0}
.desk-fields,.investment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.investment-grid article h3{margin:6px 0}
.investment-grid article p{font-size:12px}
.price-chart{display:flex;align-items:end;gap:2px;overflow-x:auto;padding:4px 0 8px}
#businessDesk .price-chart button{padding:2px 0;min-width:33px;display:grid;justify-items:center;background:#172e35;border-color:transparent}
.price-chart i{width:13px;background:#75aebb;border-radius:3px}
.price-chart .chosen i{background:#a7e7c5}
.price-chart small{font-size:10px}
.price-title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.estimate{color:#bdf1d4!important;font-weight:700}
.table-scroll{overflow:auto}
#businessDesk table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
#businessDesk th,#businessDesk td{text-align:left;padding:8px 6px;border-bottom:1px solid #334d55}
#businessDesk th{color:#abc6c6}
#businessDesk .desk-note{font-size:12px}
@media(max-width:480px){#deskBody{padding:12px 11px 4px}#deskHeader{padding-left:11px;padding-right:11px}}

.daily-bars{display:grid;gap:4px}
.daily-bars div{display:grid;grid-template-columns:32px minmax(0,1fr) 92px;align-items:center;gap:8px;font-size:12px}
.daily-bars i{width:var(--amount);height:10px;background:#80ceaa;border-radius:3px}
.daily-bars i.negative{background:#f2aa89}
.daily-bars b{text-align:right;font-variant-numeric:tabular-nums}

const key=(x,y)=>x+','+y;
function starterRoads(){const a=[];for(let y=0;y<16;y++)a.push(key(2,y));for(let x=0;x<16;x++)a.push(key(x,9));for(let y=4;y<12;y++)a.push(key(10,y));return [...new Set(a)];}
function fresh(){return {cash:20,day:1,hour:8,price:115,revenue:0,fuel:0,carbon:0,opex:0,profit:0,gasMWh:0,batteryMWh:0,exportMWh:0,assets:[{id:1,type:'OCGT',x:5,y:5,mw:50,name:'Meridian OCGT 1',status:'operational',progress:0},{id:2,type:'Gas',x:3,y:7,name:'Gas receiving',status:'operational',progress:0},{id:3,type:'Grid',x:8,y:4,name:'Grid connection',status:'operational',progress:0},{id:4,type:'Office',x:3,y:3,name:'Control building',status:'operational',progress:0}],roads:starterRoads(),owned:['0,0','1,0','0,1','1,1'],nextId:5,paused:false,speed:0,history:[],daily:{revenue:0,profit:0,export:0}};}
const freshCamera=()=>({x:0,y:-20,zoom:.9,rot:0});
let state=fresh(),camera=freshCamera(),selected=null,mode=null,preview=null,removing=false,landMode=false,reportOpen=false,tab='Operations',period='day',panelMin=false,modalAction=null,acc=0,last=performance.now(),w=0,h=0,ratio=1,toastTimer,uiDirty=true,chartDirty=true;
function resize(){ratio=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);}addEventListener('resize',resize);resize();
// World coordinates are never rotated. Only the camera projection rotates them.
function rotate(x,y){const dx=x-12,dy=y-12,c=Math.cos(camera.rot),s=Math.sin(camera.rot);return {x:dx*c-dy*s+12,y:dx*s+dy*c+12};}
function unrotate(x,y){const dx=x-12,dy=y-12,c=Math.cos(camera.rot),s=Math.sin(camera.rot);return {x:dx*c+dy*s+12,y:-dx*s+dy*c+12};}
function project(x,y,z=0){const p=rotate(x,y);return {x:w/2+camera.x+(p.x-p.y)*TW*.5*camera.zoom,y:h*.42+camera.y+(p.x+p.y)*TH*.5*camera.zoom-z*camera.zoom};}
function screenTile(x,y){const u=(x-w/2-camera.x)/(TW*.5*camera.zoom),v=(y-h*.42-camera.y)/(TH*.5*camera.zoom),p=unrotate((u+v)/2,(v-u)/2);return {x:Math.floor(p.x),y:Math.floor(p.y)};}
function poly(points,fill,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function line(a,b,color,lw=2){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=lw*camera.zoom;ctx.stroke();}
let renderQueue=[];
function depthAt(x,y){const q=rotate(x,y);return q.x+q.y;}
function structurePoint([x,y,z]){
 return {...project(x,y,z),depth:depthAt(x,y)};
}
function face(vertices,color,stroke='#293841'){
 const points=vertices.map(structurePoint);
 renderQueue.push({kind:'face',points,color,stroke,
  depth:points.reduce((sum,p)=>sum+p.depth,0)/points.length});
}
function edge(a,b,color,lw=2){
 const start=structurePoint(a),end=structurePoint(b);
 renderQueue.push({kind:'line',a:start,b:end,color,lw,depth:(start.depth+end.depth)/2});

function createStructureRenderer(){
 const surface=document.createElement('canvas');
 const gl=surface.getContext('webgl',{alpha:true,depth:true,antialias:true});
 if(!gl)return null;
 function compile(type,source){
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);

  attribute vec3 position;
  attribute vec3 color;
  varying vec3 tint;
  void main(){gl_Position=vec4(position,1.0);tint=color;}
 `);
 const fragment=compile(gl.FRAGMENT_SHADER,`
  precision mediump float;
  varying vec3 tint;
  void main(){gl_FragColor=vec4(tint,1.0);}
 `);
 if(!vertex||!fragment)return null;

 gl.attachShader(program,vertex);
 gl.attachShader(program,fragment);
 gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))return null;
 const buffer=gl.createBuffer();
 const position=gl.getAttribLocation(program,'position');
 const color=gl.getAttribLocation(program,'color');
 const colors=new Map();
 function rgb(hex){
  if(!colors.has(hex)){
   const value=parseInt(hex.slice(1),16);
   colors.set(hex,[(value>>16)/255,((value>>8)&255)/255,(value&255)/255]);
  }

 }

  if(gl.isContextLost()||!w||!h)return false;

  if(surface.height!==canvas.height)surface.height=canvas.height;
  const vertices=[];
  // At a given screen position, increasing rotated ground depth moves toward the camera.
  function vertexAt(p,tint,bias){
   vertices.push(2*p.x/w-1,1-2*p.y/h,-(p.depth+bias)/(4*N),...tint);
  }
  function stroke(a,b,width,tint,bias){
   const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy);
   if(!length)return;

   const p={...a,x:a.x+x,y:a.y+y},q={...a,x:a.x-x,y:a.y-y};
   const r={...b,x:b.x+x,y:b.y+y},t={...b,x:b.x-x,y:b.y-y};
   for(const point of [p,q,r,q,t,r])vertexAt(point,tint,bias);
  }
  for(const item of renderQueue){
   const tint=rgb(item.color);
   if(item.kind==='line'){
    stroke(item.a,item.b,item.lw*camera.zoom,tint,.003);
    continue;
   }
   const points=item.points;
   for(let i=1;i<points.length-1;i++){
    for(const p of [points[0],points[i],points[i+1]])vertexAt(p,tint,0);
   }
   if(item.stroke){
    const outline=rgb(item.stroke);
    points.forEach((p,i)=>stroke(p,points[(i+1)%points.length],.7,outline,.003));
   }
  }
  gl.viewport(0,0,surface.width,surface.height);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STREAM_DRAW);
  gl.enableVertexAttribArray(position);
  gl.enableVertexAttribArray(color);
  gl.vertexAttribPointer(position,3,gl.FLOAT,false,24,0);
  gl.vertexAttribPointer(color,3,gl.FLOAT,false,24,12);
  gl.drawArrays(gl.TRIANGLES,0,vertices.length/6);
  ctx.drawImage(surface,0,0,w,h);
  return true;
 };
}
const renderStructures=createStructureRenderer();
function box3(x,y,sx,sy,z,height,roof,wall='#597480'){
 const b=[[x,y,z],[x+sx,y,z],[x+sx,y+sy,z],[x,y+sy,z]],t=b.map(p=>[p[0],p[1],z+height]);
 const cd=depthAt(x+sx/2,y+sy/2);
 for(let i=0;i<4;i++){
  const j=(i+1)%4;
  const d=depthAt((b[i][0]+b[j][0])/2,(b[i][1]+b[j][1])/2);
  if(d>cd+1e-6)face([b[i],b[j],t[j],t[i]],i%2?'#394d52':wall);
 }
 face(t,roof);
}
function post(x,y,z1,z2,color='#d2dad9',size=.12){
 box3(x-size,y-size,size*2,size*2,z1,Math.max(.1,z2-z1),color,'#81939c');
}
function crane(a){
 const x=a.x+2.35,y=a.y+.2,z=60;
 // All elements share the same XYZ world axes.
 post(x,y,0,z,'#e7b54c',.09);
 edge([x-.95,y,z],[x+2.05,y,z],'#efc65f',3);
 edge([x,y,z],[x+1.1,y,z+7],'#e9c65f',1.5);
 edge([x+1.1,y,z+7],[x+2.05,y,z],'#e9c65f',1.5);
 edge([x+1.62,y,z],[x+1.62,y,27],'#d9ded6',1);
 box3(x+1.5,y-.12,.24,.24,24,3,'#e0b455');
}
function scaffolding(a,p){
 const z=Math.max(9,TYPES[a.type].height*p+6),x=a.x,y=a.y;
 const c=[[x+.02,y+.02],[x+1.98,y+.02],[x+1.98,y+1.98],[x+.02,y+1.98]];
 for(const [xx,yy] of c)edge([xx,yy,0],[xx,yy,z],'#edc76e',1.8);
 for(let zz=6;zz<z;zz+=7)for(let i=0;i<4;i++)edge([...c[i],zz],[...c[(i+1)%4],zz],'#edc76e',1.4);
 crane(a);
}
function addBuilding(a){
 const t=TYPES[a.type];if(!t)return;
 const p=a.status==='building'?Math.max(0,Math.min(1,a.progress||0)):1;
 const constructing=a.status==='building',x=a.x,y=a.y,z=t.height*Math.max(.06,p);
 if(constructing)face([[x,y,1],[x+2,y,1],[x+2,y+2,1],[x,y+2,1]],'#c0b59b');
 if(!constructing||p>.16){
  // Each asset is a collection of fixed-position industrial components.
  if(a.type==='OCGT'){
   box3(x+.15,y+.15,1.7,1.7,0,z,'#c7b78f');
   if(p>.55){
    edge([x+.19,y+.2,z+.7],[x+1.78,y+.2,z+.7],'#ffe19b',2);
    box3(x+.25,y+.25,.65,.55,z,Math.max(1,4*p),'#b6c6ca');
    box3(x+.28,y+1.42,1.3,.22,z,Math.max(1,3*p),'#b4a579');
   }
   if(p>.65){
    post(x+1.43,y+.48,z,52*p,'#cfd8da',.14);
    post(x+1.43,y+1.18,z,52*p,'#cfd8da',.14);
    // Dark flue openings on top of each stack.
    for(const yy of [y+.48,y+1.18])face([
     [x+1.29,yy-.14,52*p+.08],[x+1.57,yy-.14,52*p+.08],
     [x+1.57,yy+.14,52*p+.08],[x+1.29,yy+.14,52*p+.08]
    ],'#455762');
   }
  }else if(a.type==='Battery'){
   box3(x+.12,y+.13,1.76,1.74,0,Math.max(2,z*.28),'#a6b4b2');
   for(let i=0;i<2;i++)box3(x+.24,y+.24+i*.83,1.52,.65,Math.max(1,z*.28),Math.max(2,z*.72),'#cde0cc');
   if(p>.65)for(let i=0;i<2;i++)edge([x+.3,y+.35+i*.83,z+1],[x+1.65,y+.35+i*.83,z+1],'#718f9b',2);
  }else if(a.type==='Grid'){
   box3(x+.13,y+.13,1.74,1.74,0,Math.max(2,z*.23),'#a5b5b4');
   if(p>.45)for(let i=0;i<2;i++){
    box3(x+.28+i*.8,y+.38,.58,.95,Math.max(1,z*.23),Math.max(2,z*.6),'#669793');
    for(let j=0;j<3;j++)post(x+.45+i*.8,y+.5+j*.22,z*.8,z*1.45,'#d4dcda',.045);
   }
  }else if(a.type==='Gas'){
   box3(x+.12,y+.12,1.76,1.76,0,Math.max(2,z*.35),'#ac8d56');
   if(p>.5)for(let i=0;i<3;i++){
    box3(x+.25,y+.28+i*.48,1.4,.18,z*.35,Math.max(1,z*.32),'#d7b56e');
   }
  }else{
   box3(x+.15,y+.15,1.7,1.7,0,z,t.color);
   if(p>.5){

    box3(x+.3,y+1.28,1.35,.32,z,Math.max(1,2*p),'#667f8b');

}
function owned(x,y){return x>=0&&y>=0&&x<N&&y<N&&state.owned.includes(key(Math.floor(x/8),Math.floor(y/8)));}
function adjacent(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>state.owned.includes(key(x+dx,y+dy)));}
function drawFence(){
 // Draw each exterior boundary edge once, avoiding doubled posts at parcel joins.
 const segments=new Map(),posts=new Map();
 function add(x1,y1,x2,y2){
  const id=[[x1,y1],[x2,y2]].map(v=>v.join(',')).sort().join('|');
  segments.set(id,[x1,y1,x2,y2]);
  posts.set(key(x1,y1),[x1,y1]);posts.set(key(x2,y2),[x2,y2]);
 }
 for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(owned(x,y)){
  if(!owned(x,y-1))add(x,y,x+1,y);
  if(!owned(x+1,y))add(x+1,y,x+1,y+1);
  if(!owned(x,y+1))add(x,y+1,x+1,y+1);
  if(!owned(x-1,y))add(x,y,x,y+1);
 }
 for(const [x1,y1,x2,y2] of segments.values())edge([x1,y1,3],[x2,y2,3],'#e3e8db',2);
 for(const [x,y] of posts.values())edge([x,y,0],[x,y,9],'#dbe5dd',2);
}
function serviceTile(x,y,z=0){return [project(x,y,z),project(x+1,y,z),project(x+1,y+1,z),project(x,y+1,z)];}
function drawServiceAreas(){
 if(!mode||!TYPES[mode].requires.length)return;
 const needs=TYPES[mode].requires;
 for(let x=0;x<N;x++)for(let y=0;y<N;y++){
  if(!owned(x,y))continue;
  const linked=needs.filter(req=>hasService(req,x,y)).length;
  if(linked)poly(serviceTile(x,y),linked===needs.length?'#bff39947':'#efc47e32');
 }
}
function drawUtilities(){
 const grid=state.assets.filter(a=>a.type==='Grid'&&a.status==='operational');
 const financeFlow=finance().lastFlow;
 for(const a of assetsForDispatch()){
  const r=a.activity;if(!r)continue;
  const g=grid.filter(g=>Math.abs(g.x-a.x)+Math.abs(g.y-a.y)<=8).sort((g,k)=>Math.abs(g.x-a.x)+Math.abs(g.y-a.y)-Math.abs(k.x-a.x)-Math.abs(k.y-a.y))[0];
  if(!g||!(r.out||r.charge||r.curtailed))continue;
  const p=[a.x+1,a.y+1,1],q=[g.x+1,g.y+1,1],corner=[p[0],q[1],1];
  const color=financeFlow?.curtailed>0?'#ff7566':'#9af091';
  edge(p,corner,'#263442',4);edge(corner,q,'#263442',4);
  edge(p,corner,color,1.8);edge(corner,q,color,1.8);
  const t=(performance.now()/1000%1),s=r.charge?1-t:t;
  const len1=Math.abs(p[1]-corner[1]),len2=Math.abs(q[0]-corner[0]),d=s*(len1+len2);
  const [x,y]=d<=len1?[p[0],p[1]+Math.sign(corner[1]-p[1])*d]:[corner[0]+Math.sign(q[0]-corner[0])*(d-len1),corner[1]];
  box3(x-.06,y-.06,.12,.12,1.1,1.5,'#ffefac',color);
 }
}
function mapBadge(p,text,color){

 const width=ctx.measureText(text).width+13;
 ctx.fillStyle='#23303a';ctx.fillRect(p.x-width/2,p.y-9,width,18);

 ctx.fillStyle=color;ctx.fillText(text,p.x,p.y);ctx.restore();

function drawActivity(){
 for(const a of state.assets){
  const r=a.activity;
  if(a.status==='building'){
   if(a.fundingHold)mapBadge(project(a.x+1,a.y+1,77),'Funding hold','#ff8d79');
   continue;
  }
  if(a.type==='OCGT'&&r?.out){
   for(const offset of [.48,1.18])for(let i=0;i<4;i++){
    const u=(performance.now()/1350+i*.25)%1;
    const p=project(a.x+1.43+u*.28,a.y+offset+u*.19,53+u*18);
    ctx.save();ctx.globalAlpha=(1-u)*.68;ctx.fillStyle='#fff0c9';ctx.beginPath();
    ctx.arc(p.x,p.y,(2+u*4)*camera.zoom,0,Math.PI*2);ctx.fill();ctx.restore();
   }
  }
  if(a.type==='Battery'){
   const badge=project(a.x+1,a.y+1,25);
   mapBadge(badge,r?.charge?'↓ Charge':r?.out?'↑ Export':'— Idle',r?.charge?'#ff8a7b':r?.out?'#9cf0ae':'#b0bfc0');
  }
  if(['OCGT','Battery'].includes(a.type)&&condition(a)<70)mapBadge(project(a.x+.7,a.y+.9,a.type==='OCGT'?82:45),condition(a)<40?'⚒ Critical':'⚒ Service',condition(a)<40?'#ff8172':'#ffcd7f');
 }
}

function draw(){ctx.clearRect(0,0,w,h);const tiles=[],roads=new Set(state.roads);for(let x=0;x<N;x++)for(let y=0;y<N;y++){const p=rotate(x+.5,y+.5);tiles.push({x,y,d:p.x+p.y});}tiles.sort((a,b)=>a.d-b.d);for(const t of tiles){const color=!owned(t.x,t.y)?'#91a284':roads.has(key(t.x,t.y))?'#928777':(t.x+t.y)%2?'#78925a':'#869f61';poly([project(t.x,t.y),project(t.x+1,t.y),project(t.x+1,t.y+1),project(t.x,t.y+1)],color,'#647b52',.5);}
 drawServiceAreas();
 renderQueue=[];drawUtilities();for(const a of state.assets)addBuilding(a);
 drawFence();

 }
 drawActivity();
 for(const a of state.assets){if(a.status==='building'&&!a.fundingHold){const p=project(a.x+1,a.y+1,65);ctx.fillStyle='#ffe5a0';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(Math.round((a.progress||0)*100)+'%',p.x,p.y);ctx.textAlign='left';}}

 let x=0;
 const supply=auctionSupply().map(({mw,price})=>{
  const y=122-price*1.4;
  const line='M'+(16+x*.48)+' '+y+'h'+mw*.48;x+=mw;return line;
 }).join('');
 const y=122-price*1.4;
 return '<svg class="trend" viewBox="0 0 350 150" role="img" aria-label="Forecast auction supply, demand and bid price"><path d="M16 15V122H332" stroke="#607d82" fill="none"/><path d="'+supply+'" stroke="#8bd4bd" fill="none" stroke-width="4"/><path d="M215 15V122" stroke="#f6bf74" stroke-width="3" stroke-dasharray="5 4"/><path d="M16 '+y+'H332" stroke="#f0998b" stroke-width="2"/><text x="20" y="13" fill="#e0ede6" font-size="10">£/kW/year</text><text x="265" y="144" fill="#e0ede6" font-size="10">Capacity · MW</text></svg><p class="chart-legend">Green supply · amber demand · red bid price</p>';
}
function auctionInputs(){
 const a=assetsForDispatch().filter(operating),price=Number($('auctionPrice')?.value??28);
 return {price,player:a.map(x=>({asset:x.id,name:x.name,mw:value('cap-'+x.id),price}))};
}
function updateAuction(){
 const {price,player}=auctionInputs(), empty=player.every(a=>!a.mw);
 const forecasts=Array.from({length:5},(_,i)=>simulateAuction(player,auctionDemand(i),(i-2)*3));
 const chance=forecasts.filter(a=>a.awards.length).length;
 $('auctionChart').innerHTML=marketGraph(price);
 $('auctionQuote').textContent=cashGBP(price)+'/kW/year · '+(empty?'enter MW to estimate award':(chance>=4?'Likely':chance>=2?'Uncertain':'Unlikely')+' · '+chance+'/5 forecast scenarios award capacity · average annual income '+cashGBP(forecasts.reduce((n,x)=>n+x.income,0)/5));
}
function showAuction(){
 const f=finance(),a=f.capacity,operable=assetsForDispatch().filter(operating);
 const active=a&&state.day<a.deliveryDay+360;
 return '<div class="desk-heading"><h2>Capacity Market</h2><p>Bid for an annual capacity agreement. Higher prices risk losing the contract. More awarded MW increases both income and exposure.</p></div>'+
 (active?'<div class="desk-metrics">'+card('Clearing price',cashGBP(a.price)+'/kW/year')+card('Award',allocatedCapacity()+' MW')+card('Annual income',cashGBP(a.income))+'</div>'+
 (a.awards.length?table(['Asset','Contracted capacity'],a.awards.map(o=>[o.name,o.mw+' MW']))+'<p>Delivery from day '+a.deliveryDay+'. Stress warnings arrive four hours before each call.</p>'+btn('Open Messages','tab-messages'):'<p>No capacity awarded.</p>'+btn('Open next auction','auction-retry')):
 '<div id="auctionChart"></div><label>Minimum bid price<input id="auctionPrice" type="range" min="10" max="75" value="28"></label><div class="desk-fields">'+operable.map(x=>field('cap-'+x.id,x.name+' · eligible '+capacityLimit(x)+' MW',0,0,capacityLimit(x),.5)).join('')+'</div><p class="estimate" id="auctionQuote"></p>'+btn('Submit bid','auction-65','primary')+' '+btn('Skip auction','tab-overview'))+
 '<p class="desk-note">Illustrative auction and penalty rules. The realised supply and demand can differ from the forecast.</p>';
}
function loanDue(days=90){
 return (finance().loans||[]).reduce((n,l)=>n+Math.min(l.remaining,Math.max(0,Math.floor((state.day+days-l.next)/30)+1))*(l.amount/12+l.balance*l.rate/12),0);
}
function serviceDebt(){
 if(state.hour!==0)return 0;
 let interest=0;
 for(const l of finance().loans||[]){
  if(l.remaining<=0||state.day<l.next)continue;
  const principal=Math.min(l.balance,l.amount/12),fee=l.balance*l.rate/12;
  l.balance-=principal;l.remaining--;l.next+=30;
  state.cash-=principal;interest+=fee*1e6;
 }
 return interest;
}
let appraisal=null;
function plotAppraisal(){
 if(!appraisal)return '<p>Choose a plot from Build to appraise an asset.</p>';
 const {type,x,y}=appraisal,t=TYPES[type];
 const missing=t.requires.filter(k=>!hasService(k,x,y));
 const extra=missing.reduce((n,k)=>n+TYPES[k].cost,0);
 return '<div class="desk-heading"><h2>'+t.name+' appraisal</h2><p>Plot '+(x+1)+', '+(y+1)+'</p></div>'+
 '<div class="desk-metrics">'+card('Project cost',money(t.cost))+card('Available cash',money(state.cash))+card('Cash after commitments',money(state.cash-committedCapital()-loanDue()))+'</div>'+
 (missing.length?'<p>Missing: '+missing.map(k=>TYPES[k].name).join(', ')+'. Allow '+money(extra)+' more for infrastructure.</p>':'<p>Required site services available at this plot.</p>')+
 '<label>Debt share <output id="loanShare"></output><input id="appraisalDebt" type="range" min="0" max="75" step="5" value="'+(appraisal.debt||0)+'"></label>'+
 '<p id="loanCost" class="desk-note"></p><div id="payoffChart"></div>'+
 btn('Return to plot','appraisal-back')+' '+btn('Confirm project','appraisal-build','primary');
}
function quoteAppraisal(){
 if(!appraisal||!$('appraisalDebt'))return;
 appraisal.debt=Number($('appraisalDebt').value);
 const {type,x,y,debt}=appraisal,t=TYPES[type],amount=t.cost*debt/100,fee=amount*.075*(13/24);
 const missing=t.requires.filter(k=>!hasService(k,x,y)),extra=missing.reduce((n,k)=>n+TYPES[k].cost,0);
 const output=(investment[type]?.base||0)*(type==='OCGT'||type==='Battery'?.45+.55*Math.min(1,Math.max(0,gridMW()-gasMW())/(t.mw||1)):1);
 const initial=t.cost+extra,total=initial+fee;
 $('loanShare').textContent=debt+'%';
 $('loanCost').textContent=debt?'Borrow '+money(amount)+' at 7.5% APR over 12 in-game months. Estimated interest '+money(fee)+'.':'Funding from cash.';
 const rows=Array.from({length:11},(_,year)=>({day:year,forecast:-total+output*year,down:-total+(investment[type]?.down||0)*year}));
 const pb=output?total/output:Infinity;
 $('payoffChart').innerHTML='<h3>Cumulative project cash flow</h3>'+comparePlot(rows,r=>r.down,r=>r.forecast,true).replace('🟠 Plan · 🟢 Actual · day 0–10','🟠 Downside · 🟢 Base · years 0–10')+
 '<p>'+(pb<=10?'Estimated base-case payback '+pb.toFixed(1)+' years.':'Outside the 10-year payback window. You can still build.')+'</p>';
}
function handleBusiness(action){
 const f=finance();
 if(action==='campaign-skip'){f.ceo=0;for(const c of chapters)f[c[3]]=true;desk.close();}
 else if(action==='ceo-change'){delete f.ceo;}
 else if(action.startsWith('ceo-'))f.ceo=Number(action.slice(4));
 else if(action.startsWith('chapter-')){
  const [,,target,key]=chapters[Number(action.slice(8))];deskTab=target;
  if(key==='reviewed'||key==='complete')f[key]=true;
 }
 else if(action==='book-service'){
  const q=serviceQuote();if(!q||q.start<=absoluteNow())return 'Choose an operating asset and a future start time.';
  if(f.maintenance.some(m=>m.asset===q.a.id&&!m.completed&&overlapping({start:q.start,end:q.end},absoluteWindow(m))))return 'That overlaps an existing service window.';
  f.maintenanceSeq=(f.maintenanceSeq||0)+1;
  f.maintenance.push({id:f.maintenanceSeq,asset:q.a.id,day:state.day+q.d,start:q.h,until:q.end,cost:q.profile.cost,restore:q.profile.restore,label:q.profile.label});
  f.protected=true;deskStatus='Service booked.';
 }
 else if(action.startsWith('reserve-')){
  const e=nextStress(),a=state.assets.find(a=>a.id===Number(action.slice(8)));
  if(!e||!a||a.type!=='Battery'||state.hour>=e.start)return 'The stress event has started or this battery is unavailable.';
  a.stressChargeDay=e.day;
  deskStatus='Battery will import if needed to cover its award. This can override a scheduled export and incur imbalance costs.';
 }
 else if(action.startsWith('rush-')){
  const m=f.maintenance.find(m=>m.id===Number(action.slice(5)));
  if(!m||m.completed||m.rushed||absoluteWindow(m).end<=absoluteNow()+2||state.cash<.012)return 'This service cannot be rushed.';
  m.until=absoluteNow()+2;m.rushed=true;state.cash-=.012;f.incidental=(f.incidental||0)+12000;
  postMessage('Service rush authorised','£12,000 approved. A return-to-service check is due in one hour.','plant');
 }
 else if(action==='auction-retry'){if(!f.capacity?.awards.length)f.capacity=null;}
 else if(action==='auction-65'){
  const {price,player}=auctionInputs();
  if(!player.some(a=>a.mw>0)||player.some(a=>!Number.isFinite(a.mw)))return 'Enter valid capacity bids for at least one asset.';
  if(player.reduce((n,a)=>n+a.mw,0)>gridMW())return 'Total bid exceeds the available connection.';
  const result=simulateAuction(player,auctionDemand((state.day+Math.floor(state.cash*17))%5),Math.round(4*Math.sin(state.day)));
  const deliveryDay=state.day+3,count=1+(state.day%3);
  const events=Array.from({length:count},(_,i)=>({day:deliveryDay+6+i*(70+state.day%35),start:18+(i%2),warned:false,finished:false}));
  f.capacity={...result,deliveryDay,events};f.protected=true;
  postMessage('Capacity auction result',result.awards.length?'Award secured at '+cashGBP(result.price)+'/kW/year. Delivery begins on day '+deliveryDay+'.':'Your bid did not clear. Review the result before entering again.','capacity');
 }
 else if(action==='appraisal-back'||action==='appraisal-build'){
  if(!appraisal)return;
  const {x,y,debt}=appraisal;desk.close();
  if(action==='appraisal-build')askBuild(x,y,debt||0);
 }
 else return null;
 return '';
}

const views={overview:showOverview,campaign:showCampaign,dispatch:seasonalDesk,capital:showInvestment,plant:showMaintenance,capacity:showAuction,report:()=>showQuarter(),variance:()=>showQuarter(true),advisors:showAdvisors,messages:showMessages,appraisal:plotAppraisal};
function renderDesk(){
 $('deskNav').innerHTML=Object.entries(deskTabs).map(([key,label])=>btn(label,'tab-'+key,key===deskTab?'selected':'')).join('');
 $('deskBody').innerHTML=views[deskTab]();
 $('deskClock').textContent='Day '+state.day+' · '+String(Math.floor(state.hour)).padStart(2,'0')+':'+(state.hour%1?'30':'00');
 $('deskStatus').textContent=deskStatus;
 if(deskTab==='dispatch'){
  $('seasonScope').onchange=e=>{dispatchGroup=e.target.value;dispatchDraft=null;renderDesk();};
  if($('bmSlider'))$('bmSlider').oninput=updateEstimate;updateEstimate();
 }
 const connect=(id,event,handler)=>{if($(id))$(id)[event]=handler;};
 connect('reportQuarter','onchange',e=>{reportQuarter=e.target.value;renderDesk();});
 connect('reportScope','onchange',e=>{reportScope=e.target.value;renderDesk();});
 if($('auctionChart')){document.querySelectorAll('#deskBody input').forEach(e=>e.oninput=updateAuction);updateAuction();}
 if($('appraisalDebt')){$('appraisalDebt').oninput=quoteAppraisal;quoteAppraisal();}
 if($('serviceEstimate')){
  const quote=()=>{const q=serviceQuote();$('serviceEstimate').textContent=q?'Service '+cashGBP(q.profile.cost)+' · estimated lost margin '+cashGBP(q.margin)+' · restores up to '+Math.round(q.profile.restore*100)+' condition points'+(q.risk?' · overlaps a stress event':''):'Select an asset and service window.';};
  for(const id of ['maintenanceAsset','serviceDay','serviceHour','serviceKind'])connect(id,'onchange',quote);quote();
 }
}

function openDesk(tab='overview'){
 deskTab=tab;deskStatus='';
 if(!desk.open){state.paused=true;uiDirty=true;desk.showModal();}
 renderDesk();
}
function advance(ticks){for(let i=0;i<ticks;i++){step();if(showcaseStop){showcaseStop=false;break;}}}
function doDesk(action){
 const f=finance(),a=state.assets.find(a=>a.id===deskAsset);
 deskStatus='';
 if(action.startsWith('season-')||action.startsWith('hour-'))return seasonalAction(action);
 if(action.startsWith('variance-')){waterfallDetail=action.slice(9);return;}
 if(deskTab==='dispatch'&&dispatchPending()&&(action.startsWith('tab-')||action==='close'||action==='rotate'))return 'Apply the manual plan or switch the remaining manual assets to Auto first.';
 const handled=handleBusiness(action);if(handled!==null)return handled;
 if(action.startsWith('tab-')){
  deskTab=action.slice(4);
  if(deskTab==='plant')f.reviewed=true;
  if(deskTab==='capital')f.appraised=true;
 }else if(action==='close'||action==='rotate'){
  if(action==='rotate')camera.rot+=Math.PI/4;
  desk.close();return;
 }else if(action.startsWith('build-')){
  const type=action.slice(6);
  if(state.cash<TYPES[type].cost*.2)return 'Cash is below the required deposit.';
  mode=type;preview=null;removing=false;landMode=false;selected=null;
  $('remove').classList.remove('active');$('land').classList.remove('active');
  desk.close();placementPanel();return;
 }else if(action==='upgrade'){
  const grid=state.assets.find(a=>a.type==='Grid'&&a.status==='operational');
  if(!grid||f.upgrade||state.cash<2)return 'The upgrade needs an operating transformer and £2m in cash.';
  state.cash-=2;recordCapital('Transformer upgrade',2);
  f.upgrade={asset:grid.id,day:state.day+2};deskStatus='Upgrade approved. Commissioning on day '+f.upgrade.day+'.';
 }else if(action.startsWith('service-cancel-')){
  const id=Number(action.slice(15));f.maintenance=f.maintenance.filter(m=>m.id!==id||absoluteWindow(m).start<=absoluteNow());
 }else if(action==='advance-tick')advance(1);
 else if(action==='advance-day')advance(48);
 else if(action==='advance-week')advance(336);

}
$('businessOpen').onclick=()=>openDesk();$('waterfallOpen').onclick=()=>{reportOpen=false;$('report').style.display='none';openDesk('variance');};
$('deskClose').onclick=()=>{const message=doDesk('close');if(message)$('deskStatus').textContent=message;};
desk.addEventListener('cancel',event=>{if(deskTab==='dispatch'&&dispatchPending()){event.preventDefault();$('deskStatus').textContent='Apply the manual plan or switch to Auto.';}});
desk.addEventListener('click',event=>{
 const action=event.target.closest('[data-action]')?.dataset.action;
 if(!action)return;
 const error=doDesk(action);
 if(error){$('deskStatus').textContent=error;return;}
 save(false);if(desk.open)renderDesk();
});

if(!finance().opened){finance().opened=true;openDesk('campaign');save(false);}
</script></body></html>
