<script>
"use strict";

const $=id=>document.getElementById(id);
const canvas=$("world");
const ctx=canvas.getContext("2d");
const N=24,TW=48,TH=25;
const KEY="pge-v02";
const SPEEDS=[1,4,12,48];

const TYPES={
 OCGT:{
  name:"Gas peaking turbine",cost:5,days:3,
  size:2,mw:20,height:22,color:"#9caeb8",
  desc:"Dispatchable gas generation. Requires gas supply and grid connection within eight tiles.",
  requires:["Gas","Grid"]
 },
 Battery:{
  name:"Battery storage",cost:3,days:2,
  size:2,mw:10,height:13,color:"#d8d8c9",
  desc:"10MW / 20MWh storage. Charges at low prices and sells at high prices. Requires a grid connection.",
  requires:["Grid"]
 },
 Gas:{
  name:"Gas receiving station",cost:1.2,days:2,
  size:2,height:12,color:"#c6ae7a",
  desc:"Supplies gas to turbines within eight tiles.",
  requires:[]
 },
 Grid:{
  name:"Grid transformer",cost:2,days:3,
  size:2,height:14,color:"#86a9ba",
  desc:"Provides 80MW of export capacity and connects nearby generation and storage.",
  requires:[]
 },
 Office:{
  name:"Control building",cost:.5,days:1,
  size:2,height:17,color:"#b5c8d2",
  desc:"Site control and administration.",
  requires:[]
 },
 Road:{
  name:"Access road",cost:.05,days:0,
  size:1,height:0,color:"#747c7b",
  desc:"Road tile. Build multiple roads without leaving road mode.",
  requires:[]
 }
};

const key=(x,y)=>x+","+y;

function starterRoads(){
 const roads=[];
 for(let y=0;y<16;y++)roads.push(key(2,y));
 for(let x=0;x<16;x++)roads.push(key(x,9));
 for(let y=4;y<12;y++)roads.push(key(10,y));
 return [...new Set(roads)];
}

function fresh(){
 return {
  cash:20,day:1,hour:8,price:115,
  revenue:0,fuel:0,carbon:0,opex:0,profit:0,
  gasMWh:0,batteryMWh:0,exportMWh:0,
  assets:[
   {id:1,type:"OCGT",x:5,y:5,mw:50,name:"Meridian OCGT 1",status:"operational",progress:0},
   {id:2,type:"Gas",x:3,y:7,name:"Gas receiving",status:"operational",progress:0},
   {id:3,type:"Grid",x:8,y:4,name:"Grid connection",status:"operational",progress:0},
   {id:4,type:"Office",x:3,y:3,name:"Control building",status:"operational",progress:0}
  ],
  roads:starterRoads(),
  owned:["0,0","1,0","0,1","1,1"],
  nextId:5,paused:false,speed:0,
  history:[],
  daily:{revenue:0,profit:0,export:0},
  lastDay:null
 };
}

function camFresh(){
 return {x:0,y:-20,zoom:.9,rot:0};
}

let state=fresh();
let camera=camFresh();
let selected=null,mode=null,preview=null;
let removing=false,landMode=false;
let reportOpen=false,tab="Operations";
let period="day",panelMin=false;
let modalAction=null;
let acc=0,last=performance.now();
let w=0,h=0,ratio=1,toastTimer;

// CAMERA

function resize(){
 ratio=Math.min(devicePixelRatio||1,2);
 w=canvas.clientWidth;
 h=canvas.clientHeight;
 canvas.width=Math.round(w*ratio);
 canvas.height=Math.round(h*ratio);
 ctx.setTransform(ratio,0,0,ratio,0,0);
}

addEventListener("resize",resize);
resize();

function rot(x,y){
 const dx=x-12,dy=y-12;
 const c=Math.cos(camera.rot),s=Math.sin(camera.rot);
 return {x:dx*c-dy*s+12,y:dx*s+dy*c+12};
}

function unrot(x,y){
 const dx=x-12,dy=y-12;
 const c=Math.cos(camera.rot),s=Math.sin(camera.rot);
 return {x:dx*c+dy*s+12,y:-dx*s+dy*c+12};
}

function proj(x,y,z=0){
 const p=rot(x,y);
 return {
  x:w/2+camera.x+(p.x-p.y)*TW/2*camera.zoom,
  y:h*.42+camera.y+(p.x+p.y)*TH/2*camera.zoom-z*camera.zoom
 };
}

function tileAt(x,y){
 const u=(x-w/2-camera.x)/(TW/2*camera.zoom);
 const v=(y-h*.42-camera.y)/(TH/2*camera.zoom);
 const p=unrot((u+v)/2,(v-u)/2);
 return {x:Math.floor(p.x),y:Math.floor(p.y)};
}

function polygon(points,fill,stroke=null,lw=1){
 ctx.beginPath();
 ctx.moveTo(points[0].x,points[0].y);
 for(let i=1;i<points.length;i++)
  ctx.lineTo(points[i].x,points[i].y);
 ctx.closePath();
 ctx.fillStyle=fill;
 ctx.fill();
 if(stroke){
  ctx.strokeStyle=stroke;
  ctx.lineWidth=lw;
  ctx.stroke();
 }
}

function segment(a,b,color,lw=2){
 ctx.beginPath();
 ctx.moveTo(a.x,a.y);
 ctx.lineTo(b.x,b.y);
 ctx.strokeStyle=color;
 ctx.lineWidth=lw*camera.zoom;
 ctx.stroke();
}

// ROTATION-SAFE 3D COMPONENTS
// Each cuboid is rendered as a separate object.
// Only camera-facing walls are drawn.

function cuboid(x,y,sx,sy,height,roof,base=0){
 const corners=[
  [x,y],[x+sx,y],
  [x+sx,y+sy],[x,y+sy]
 ];

 const c=rot(x+sx/2,y+sy/2);

 const faces=[
  {
   visible:c.y<rot(x+sx/2,y).y,
   indices:[0,1],
   color:"#536d79"
  },
  {
   visible:c.x>rot(x+sx,y+sy/2).x,
   indices:[1,2],
   color:"#415a66"
  },
  {
   visible:c.y>rot(x+sx/2,y+sy).y,
   indices:[2,3],
   color:"#536d79"
  },
  {
   visible:c.x<rot(x,y+sy/2).x,
   indices:[3,0],
   color:"#415a66"
  }
 ];

 // Camera depth is based on rotated X+Y,
 // not the original world-facing direction.
 const centreDepth=c.x+c.y;

 const visibleFaces=[];

 for(let i=0;i<4;i++){
  const a=corners[i];
  const b=corners[(i+1)%4];
  const mid=rot(
   (a[0]+b[0])/2,
   (a[1]+b[1])/2
  );

  if(mid.x+mid.y>centreDepth){
   visibleFaces.push({
    depth:mid.x+mid.y,
    a,b,
    color:i%2?"#425c68":"#56717d"
   });
  }
 }

 visibleFaces.sort((a,b)=>a.depth-b.depth);

 for(const f of visibleFaces){
  polygon([
   proj(f.a[0],f.a[1],base),
   proj(f.b[0],f.b[1],base),
   proj(f.b[0],f.b[1],base+height),
   proj(f.a[0],f.a[1],base+height)
  ],f.color,"#344d57",.7);
 }

 polygon(
  corners.map(p=>proj(p[0],p[1],base+height)),
  roof,"#536c75",.8
 );
}

function chimney(x,y,height){
 cuboid(
  x-.13,y-.13,.26,.26,height,
  "#d2dad9"
 );
}

// The crane uses world-space coordinates.
// Its jib is horizontal in 3D, not on the screen.

function crane(a){
 const x=a.x+2.4;
 const y=a.y+.15;
 const mast=60;

 segment(
  proj(x,y,0),
  proj(x,y,mast),
  "#e5b650",4
 );

 // Jib along the world's X axis.
 segment(
  proj(x-.55,y,mast),
  proj(x+2.2,y,mast),
  "#e5b650",3
 );

 // Counterweight and cable.
 cuboid(
  x-.65,y-.12,.3,.24,4,
  "#d3b164",mast-4
 );

 const hookX=x+1.65;
 const hookY=y;

 segment(
  proj(hookX,hookY,mast),
  proj(hookX,hookY,28),
  "#e7dfc8",1.3
 );

 segment(
  proj(hookX-.13,hookY,28),
  proj(hookX+.13,hookY,28),
  "#d8a84e",3
 );
}

function scaffold(a,p){
 const x=a.x,y=a.y;
 const z=Math.max(
  8,TYPES[a.type].height*p+5
 );

 for(const xx of [x+.05,x+1.95]){
  for(const yy of [y+.05,y+1.95]){
   segment(
    proj(xx,yy,0),
    proj(xx,yy,z),
    "#f5ca62",2
   );
  }
 }

 for(let k=5;k<z;k+=7){
  const corners=[
   [x+.05,y+.05],
   [x+1.95,y+.05],
   [x+1.95,y+1.95],
   [x+.05,y+1.95]
  ];

  for(let i=0;i<4;i++){
   const a1=corners[i];
   const b1=corners[(i+1)%4];

   segment(
    proj(...a1,k),
    proj(...b1,k),
    "#e4bd62",1.5
   );
  }
 }

 crane(a);

 const pos=proj(x+1,y+1,65);
 ctx.fillStyle="#ffe5a0";
 ctx.font="bold 12px system-ui";
 ctx.textAlign="center";
 ctx.fillText(
  Math.round(p*100)+"%",
  pos.x,pos.y
 );
 ctx.textAlign="left";
}

function building(a){
 const t=TYPES[a.type];
 if(!t)return;

 const constructing=a.status==="building";
 const stage=constructing?(a.progress||0):1;
 const height=t.height*Math.max(.08,stage);

 if(constructing){
  polygon([
   proj(a.x,a.y,1),
   proj(a.x+2,a.y,1),
   proj(a.x+2,a.y+2,1),
   proj(a.x,a.y+2,1)
  ],"#c3b99a","#e5c787",1.5);

  if(stage<.18){
   for(let i=0;i<4;i++){
    segment(
     proj(a.x+.2+i*.45,a.y+.3,1),
     proj(a.x+.2+i*.45,a.y+1.7,1),
     "#7c837d",3
    );
   }
  }
 }

 if(!constructing||stage>.18){

  // Main structure.
  cuboid(
   a.x+.15,a.y+.15,
   1.7,1.7,height,t.color
  );

  // Equipment is positioned in world coordinates.
  // This keeps it attached during camera rotation.
  if(a.type==="OCGT"&&stage>.7){
   chimney(
    a.x+1.42,a.y+.45,
    52*stage
   );
   chimney(
    a.x+1.42,a.y+1.15,
    52*stage
   );
  }

  if(a.type==="Battery"&&stage>.6){
   cuboid(
    a.x+.25,a.y+.3,
    1.3,.5,2,
    "#eee9dc",height
   );
   cuboid(
    a.x+.25,a.y+1.15,
    1.3,.5,2,
    "#eee9dc",height
   );
  }

  if(a.type==="Grid"&&stage>.7){
   for(let i=0;i<3;i++){
    segment(
     proj(a.x+.3+i*.6,a.y+1.5,5),
     proj(a.x+.3+i*.6,a.y+1.5,25),
     "#d3d9d7",2
    );
   }
  }
 }

 if(constructing)scaffold(a,stage);

 if(selected===a.id){
  const p=proj(a.x+1,a.y+1,57);
  ctx.fillStyle="#ffe28a";
  ctx.beginPath();
  ctx.arc(p.x,p.y,6,0,Math.PI*2);
  ctx.fill();
 }
}

// LAND AND SITE

function owned(x,y){
 return x>=0&&y>=0&&x<N&&y<N&&
  state.owned.includes(
   key(Math.floor(x/8),Math.floor(y/8))
  );
}

function adjacent(x,y){
 return [[1,0],[-1,0],[0,1],[0,-1]]
  .some(([dx,dy])=>
   state.owned.includes(key(x+dx,y+dy))
  );
}

function drawFence(){
 for(const parcel of state.owned){
  const [bx,by]=parcel.split(",").map(Number);
  const x=bx*8,y=by*8;

  for(let i=0;i<8;i++){
   for(let side=0;side<4;side++){
    const tx=side===0?x+i:
     side===1?x+8:
     side===2?x+8-i:x;

    const ty=side===0?y:
     side===1?y+i:
     side===2?y+8:y+8-i;

    const ox=side===1?1:side===3?-1:0;
    const oy=side===0?-1:side===2?1:0;

    if(owned(tx+ox,ty+oy))continue;

    const ex=side%2?tx:tx+1;
    const ey=side%2?ty+1:ty;

    segment(
     proj(tx,ty,3),
     proj(ex,ey,3),
     "#e2e6d9",2
    );

    segment(
     proj(tx,ty,0),
     proj(tx,ty,9),
     "#d5dfd7",2
    );
   }
  }
 }
}

function draw(){
 ctx.clearRect(0,0,w,h);

 const tiles=[];
 const roads=new Set(state.roads);

 for(let x=0;x<N;x++){
  for(let y=0;y<N;y++){
   const p=rot(x+.5,y+.5);
   tiles.push({
    x,y,depth:p.x+p.y
   });
  }
 }

 tiles.sort((a,b)=>a.depth-b.depth);

 for(const t of tiles){
  const color=!owned(t.x,t.y)
   ?"#8ca795"
   :roads.has(key(t.x,t.y))
    ?"#747d7b"
    :(t.x+t.y)%2
     ?"#729679"
     :"#7c9d80";

  polygon([
   proj(t.x,t.y),
   proj(t.x+1,t.y),
   proj(t.x+1,t.y+1),
   proj(t.x,t.y+1)
  ],color,"#587765",.5);
 }

 drawFence();

 const assets=[...state.assets].sort((a,b)=>{
  const p=rot(a.x+1,a.y+1);
  const q=rot(b.x+1,b.y+1);
  return p.x+p.y-q.x-q.y;
 });

 for(const a of assets)building(a);

 if(mode&&preview){
  const t=TYPES[mode];
  const s=t.size;
  const valid=canPlace(
   mode,preview.x,preview.y
  );

  polygon([
   proj(preview.x,preview.y,2),
   proj(preview.x+s,preview.y,2),
   proj(preview.x+s,preview.y+s,2),
   proj(preview.x,preview.y+s,2)
  ],
  valid?"#62f2a56b":"#ff686877",
  valid?"#8dffb9":"#ff8888",2);

  for(const req of t.requires){
   const good=hasService(
    req,preview.x,preview.y
   );

   for(const a of state.assets.filter(
    a=>a.type===req&&a.status==="operational"
   )){
    const p=proj(a.x+1,a.y+1,3);

    ctx.beginPath();
    ctx.ellipse(
     p.x,p.y,
     8*TW*.43*camera.zoom,
     8*TW*.22*camera.zoom,
     -Math.PI/4,0,Math.PI*2
    );

    ctx.fillStyle=good
     ?"#5fe5a015"
     :"#ff62621a";
    ctx.fill();

    ctx.strokeStyle=good
     ?"#55ec9e"
     :"#ff7777";

    ctx.lineWidth=2;
    ctx.setLineDash([7,5]);
    ctx.stroke();
    ctx.setLineDash([]);
   }
  }
 }

 if(landMode){
  for(let bx=0;bx<3;bx++){
   for(let by=0;by<3;by++){
    if(
     state.owned.includes(key(bx,by))||
     !adjacent(bx,by)
    )continue;

    const x=bx*8,y=by*8;

    polygon([
     proj(x,y,2),
     proj(x+8,y,2),
     proj(x+8,y+8,2),
     proj(x,y+8,2)
    ],"#eac86c28","#eac86c",2);
   }
  }
 }

 requestAnimationFrame(draw);
}

// GAME RULES

function canPlace(type,x,y){
 const s=TYPES[type].size;

 if(
  !owned(x,y)||
  !owned(x+s-1,y+s-1)
 )return false;

 for(const a of state.assets){
  const z=TYPES[a.type].size;

  if(
   x<a.x+z&&x+s>a.x&&
   y<a.y+z&&y+s>a.y
  )return false;
 }

 for(let xx=x;xx<x+s;xx++){
  for(let yy=y;yy<y+s;yy++){
   if(state.roads.includes(key(xx,yy)))
    return false;
  }
 }

 return true;
}

function hasService(type,x,y){
 return state.assets.some(a=>
  a.type===type&&
  a.status==="operational"&&
  Math.abs(a.x-x)+Math.abs(a.y-y)<=8
 );
}

function status(a){
 if(a.status==="building")
  return "Under construction";

 if(
  a.type==="OCGT"&&
  !hasService("Gas",a.x,a.y)
 )return "No gas supply";

 if(
  ["OCGT","Battery"].includes(a.type)&&
  !hasService("Grid",a.x,a.y)
 )return "No grid connection";

 return "Operational";
}

function gasMW(){
 return state.assets
  .filter(a=>
   a.type==="OCGT"&&
   status(a)==="Operational"
  )
  .reduce((n,a)=>n+(a.mw||20),0);
}

function batteryMW(){
 return state.assets
  .filter(a=>
   a.type==="Battery"&&
   status(a)==="Operational"
  )
  .reduce((n,a)=>n+(a.mw||10),0);
}

function gridMW(){
 return state.assets.filter(a=>
  a.type==="Grid"&&
  a.status==="operational"
 ).length*80;
}

function money(n){
 return (n<0?"−":"")+
  "£"+Math.abs(n).toFixed(3)+"m";
}

function askBuild(x,y){
 if(!mode)return;

 const type=mode;
 const t=TYPES[type];

 const missing=t.requires.filter(
  req=>!hasService(req,x,y)
 );

 const description=
  "<p><b>"+t.name+"</b> at plot "+
  (x+1)+", "+(y+1)+"</p>"+
  "<p>Cost: <b>"+money(t.cost)+
  "</b><br>Build time: "+
  t.days+" days</p>"+
  '<p class="'+
  (missing.length?"bad":"good")+'">'+
  (missing.length
   ?"⚠ Missing: "+missing.join(", ")
   :"✓ Requirements satisfied")+
  "</p>";

 modal(
  type==="Road"?"Build access road":"Confirm construction",
  description,
  ()=>{
   if(
    !canPlace(type,x,y)||
    state.cash<t.cost
   ){
    toast("Unable to build at this plot");
    return;
   }

   state.cash-=t.cost;

   if(type==="Road"){
    state.roads.push(key(x,y));

    // v0.5.2: Keep road tool active.
    mode="Road";
    preview=null;
    selected=null;

    placementPanel();
    toast("Road built — select the next plot");

   }else{
    const id=state.nextId++;

    state.assets.push({
     id,type,x,y,
     name:t.name+" "+id,
     mw:t.mw||0,
     status:"building",
     progress:0,
     daysRequired:t.days,
     soc:0
    });

    selected=id;
    mode=null;
    preview=null;
    panelMin=true;

    assetPanel();
    toast("Construction started");
   }

   refresh();
   save(false);
  },
  "Build"
 );
}

function askDemolish(a){
 const value=a.status==="building"
  ?-TYPES[a.type].cost*.08
  :TYPES[a.type].cost*.06;

 modal(
  "Decommission asset",
  "<p>"+a.name+"</p>"+
  "<p>"+(value>=0
   ?"Net scrap proceeds: "
   :"Decommissioning cost: ")+
  "<b>"+money(Math.abs(value))+"</b></p>"+
  "<p>Removing gas or grid equipment may disconnect other assets.</p>",
  ()=>{
   if(state.cash+value<0){
    toast("Insufficient funds");
    return;
   }

   state.cash+=value;
   state.assets=state.assets.filter(
    b=>b.id!==a.id
   );

   closePanel();
   refresh();
   save(false);
   toast("Asset decommissioned");
  },
  "Decommission"
 );
}

 );

function selectTile(sx,sy){
 const p=tileAt(sx,sy);
 const x=p.x,y=p.y;

 if(x<0||y<0||x>=N||y>=N)return;

 if(landMode){
  const bx=Math.floor(x/8);
  const by=Math.floor(y/8);
  const k=key(bx,by);

  if(state.owned.includes(k)){
   toast("Land already owned");
   return;
  }

  if(!adjacent(bx,by)){
   toast("Purchase adjoining land first");
   return;
  }

  const cost=2.5+state.owned.length*.75;

  modal(
   "Acquire land",
   "<p>Purchase an adjoining 8 × 8 parcel.</p>"+
   "<p>Price: <b>"+money(cost)+"</b></p>"+
   "<p>The perimeter fence will expand automatically.</p>",
   ()=>{
    if(state.cash<cost){
     toast("Insufficient cash");
     return;
    }

    state.cash-=cost;
    state.owned.push(k);
    landMode=false;
    $("land").classList.remove("active");

    refresh();
    save(false);
    toast("Land acquired");
   },
   "Buy land"
  );
  return;
 }

 const a=[...state.assets].reverse().find(a=>
  x>=a.x&&x<a.x+2&&
  y>=a.y&&y<a.y+2
 );

 if(removing){
  if(a)askDemolish(a);
  else if(state.roads.includes(key(x,y)))
   askRoad(x,y);
  else toast("Nothing to remove");
  return;
 }

 if(mode){
  preview={x,y};
  placementPanel();
  return;
 }

 if(a){
  if(selected===a.id){
   closePanel();
  }else{
   selected=a.id;
   panelMin=false;
   assetPanel();
  }
 }else{
  closePanel();
 }
}

// CHARTS WITH DAY / MONTH / YEAR SELECTION

function row(k,v){
 return '<div class="row"><span>'+
  k+"</span><b>"+v+"</b></div>";
}

function historyFor(p){
 const all=state.history||[];

 const count=p==="day"
  ?48
  :p==="month"
   ?48*30
   :48*365;

 const selected=all.slice(-count);

 if(p==="day")return selected;

 // Aggregate into daily points for Month,
 // and monthly points for Year.
 const groups=new Map();

 for(const d of selected){
  const group=p==="month"
   ?d.day
   :Math.floor((d.day-1)/30);

  if(!groups.has(group)){
   groups.set(group,{
    day:d.day,hour:d.hour,
    price:0,export:0,revenue:0,
    cash:d.cash,profit:d.profit,
    count:0
   });
  }

  const g=groups.get(group);
  g.price+=d.price;
  g.export+=d.export;
  g.revenue+=d.revenue;
  g.cash=d.cash;
  g.profit=d.profit;
  g.day=d.day;
  g.hour=d.hour;
  g.count++;
 }

 return [...groups.values()].map(g=>({
  ...g,
  price:g.price/g.count
 }));
}

function plotChart(canvas,data,field,color){
 const cw=canvas.clientWidth||320;
 const ch=180;
 const r=Math.min(devicePixelRatio||1,2);
 const c=canvas.getContext("2d");

 canvas.width=Math.round(cw*r);
 canvas.height=Math.round(ch*r);
 c.setTransform(r,0,0,r,0,0);
 c.clearRect(0,0,cw,ch);

 const L=47,R=cw-12,T=15,B=ch-32;

 c.strokeStyle="#385460";
 c.fillStyle="#b6cbd0";
 c.font="10px system-ui";

 for(let i=0;i<4;i++){
  const y=T+(B-T)*i/3;
  c.beginPath();
  c.moveTo(L,y);
  c.lineTo(R,y);
  c.stroke();
 }

 if(data.length<2){
  c.fillText(
   "Waiting for historical data",
   L+10,ch/2
  );
  return;
 }

 const vals=data.map(d=>Number(d[field])||0);

 let min=Math.min(...vals);
 let max=Math.max(...vals);

 if(max===min){
  max+=1;
  min-=1;
 }

 const px=i=>L+i*(R-L)/(vals.length-1);
 const py=v=>B-(v-min)/(max-min)*(B-T);

 c.fillStyle="#c4d8da";
 c.fillText(max.toFixed(2),2,T+4);
 c.fillText(min.toFixed(2),2,B);

 c.strokeStyle=color;
 c.lineWidth=2;
 c.beginPath();

 vals.forEach((v,i)=>{
  if(i)c.lineTo(px(i),py(v));
  else c.moveTo(px(i),py(v));
 });

 c.stroke();

 const ticks=[
  0,
  Math.floor((data.length-1)/2),
  data.length-1
 ];

 for(const i of ticks){
  const d=data[i];

  let label;

  if(period==="day"){
   label=
    "D"+d.day+" "+
    String(Math.floor(d.hour)).padStart(2,"0")+
    ":"+(d.hour%1?"30":"00");
  }else if(period==="month"){
   label="Day "+d.day;
  }else{
   label="Month "+
    (Math.floor((d.day-1)/30)+1);
  }

  c.fillStyle="#b6cbd0";
  c.textAlign=i===0
   ?"left"
   :i===data.length-1
    ?"right"
    :"center";

  c.fillText(label,px(i),B+16);
 }

 c.textAlign="left";
}

function chart(title,field,color){
 return '<div class="chartTitle">'+
  title+"</div>"+
  '<canvas class="chart" data-field="'+
  field+'" data-color="'+color+

}

// SIMULATION

function price(){
 return Math.max(-25,Math.min(270,
  100+
  45*Math.sin((state.hour-8)/24*Math.PI*2)+
  19*Math.cos(state.day*.12)-
  30*Math.sin(state.day*.39+state.hour*.08)+
  14*Math.sin(state.day*.87+state.hour*.53)
 ));
}

function step(){
 state.hour+=.5;

 if(state.hour>=24){
  state.hour=0;
  state.day++;
  state.lastDay={...state.daily};
  state.daily={revenue:0,profit:0,export:0};
 }

 state.price=price();

 const gas=state.price>86
  ?Math.min(gasMW(),gridMW())
  :0;

 let remaining=Math.max(0,gridMW()-gas);
 let charge=0,discharge=0;

 for(const a of state.assets.filter(a=>
  a.type==="Battery"&&
  status(a)==="Operational"
 )){
  const soc=a.soc||0;

  if(state.price<65){
   const bought=Math.max(
    0,Math.min(5,(20-soc)/.9)
   );

   a.soc=Math.min(20,soc+bought*.9);
   charge+=bought;

  }else if(state.price>125&&remaining>0){
   const sold=Math.max(
    0,Math.min(5,remaining*.5,soc*.9)
   );

   a.soc=Math.max(0,soc-sold/.9);
   discharge+=sold;
   remaining-=sold/.5;
  }
 }

 const gen=gas*.5;
 const exp=gen+discharge;
 const rev=exp*state.price/1e6;
 const fuel=gen*55/1e6;
 const carbon=gen*23/1e6;

 const opex=
  gen*8/1e6+
  state.assets.filter(
   a=>a.status==="operational"
  ).length*120/1e6+
  charge*state.price/1e6;

 const profit=rev-fuel-carbon-opex;

 state.revenue+=rev;
 state.fuel+=fuel;
 state.carbon+=carbon;
 state.opex+=opex;
 state.profit+=profit;
 state.cash+=profit;

 state.gasMWh+=gen;
 state.batteryMWh+=discharge;
 state.exportMWh+=exp;

 state.daily.revenue+=rev;
 state.daily.profit+=profit;
 state.daily.export+=exp;

 for(const a of state.assets){
  if(a.status==="building"){
   a.progress+=.5/(
    (a.daysRequired||TYPES[a.type].days)*24
   );

   if(a.progress>=1){
    a.progress=1;
    a.status="operational";
    toast(a.name+" completed");
   }
  }
 }

 state.history.push({
  day:state.day,
  hour:state.hour,
  price:state.price,
  export:exp,
  cash:state.cash,
  profit:state.profit,
  revenue:rev
 });

 if(state.history.length>17520){
  state.history.splice(
   0,
   state.history.length-17520
  );
 }
}

function loop(now){
 const dt=Math.min((now-last)/1000,2);
 last=now;

 if(!state.paused){
  acc+=dt*SPEEDS[state.speed];

  let count=0;

  while(acc>=1&&count<100){
   step();
   acc--;
   count++;
  }

  if(count)refresh();
 }

 requestAnimationFrame(loop);
}

// GESTURES

const pointers=new Map();
let moved=false,multi=false,start=null;
let oldDist=0,oldCentre=null,oldAngle=null;

function point(e){
 const r=canvas.getBoundingClientRect();
 return {
  x:e.clientX-r.left,
  y:e.clientY-r.top
 };
}

function gestureReset(){
 oldDist=0;
 oldCentre=null;
 oldAngle=null;
}

canvas.addEventListener("pointerdown",e=>{
 canvas.setPointerCapture(e.pointerId);

 const p=point(e);
 pointers.set(e.pointerId,p);

 if(pointers.size===1){
  moved=false;
  multi=false;
  start=p;
  gestureReset();
 }

 if(pointers.size>1){
  multi=true;
  gestureReset();
 }
});

canvas.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;

 const p=point(e);
 const old=pointers.get(e.pointerId);
 pointers.set(e.pointerId,p);

 if(pointers.size===1){
  if(start&&Math.hypot(
   p.x-start.x,p.y-start.y
  )>6)moved=true;

  camera.x+=p.x-old.x;
  camera.y+=p.y-old.y;

 }else if(pointers.size===2){
  multi=true;
  moved=true;

  const v=[...pointers.values()];

  const dist=Math.hypot(
   v[1].x-v[0].x,
   v[1].y-v[0].y
  );

  const centre={
   x:(v[0].x+v[1].x)/2,
   y:(v[0].y+v[1].y)/2
  };

  const angle=Math.atan2(
   v[1].y-v[0].y,
   v[1].x-v[0].x
  );

  if(oldDist>0){
   camera.zoom=Math.max(
    .45,
    Math.min(
     2.2,camera.zoom*dist/oldDist
    )
   );
  }

  if(oldCentre){
   camera.x+=centre.x-oldCentre.x;
   camera.y+=centre.y-oldCentre.y;
  }

  if(oldAngle!==null){
   const delta=angle-oldAngle;

   camera.rot+=Math.atan2(
    Math.sin(delta),
    Math.cos(delta)
   );
  }

  oldDist=dist;
  oldCentre=centre;
  oldAngle=angle;
 }
});

function endPointer(e){
 if(
  pointers.has(e.pointerId)&&
  pointers.size===1&&
  !moved&&!multi&&
  e.type==="pointerup"
 ){
  const p=point(e);
  selectTile(p.x,p.y);
 }

 pointers.delete(e.pointerId);
 gestureReset();

 if(!pointers.size){
  start=null;
  moved=false;
  multi=false;
 }
}

canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);

// TOOLBAR

$("build").onclick=()=>{
 const open=$("menu").style.display!=="block";

 $("menu").style.display=open?"block":"none";
 $("report").style.display="none";
 reportOpen=false;

 if(open)buildMenu();
};

$("menuClose").onclick=()=>{
 $("menu").style.display="none";
};

$("analytics").onclick=()=>{
 reportOpen=!reportOpen;

 $("report").style.display=
  reportOpen?"block":"none";

 $("menu").style.display="none";

 if(reportOpen)report();
};

$("reportClose").onclick=()=>{
 reportOpen=false;
 $("report").style.display="none";
};

document.querySelectorAll("[data-tab]")
 .forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  report();
 });

$("remove").onclick=()=>{
 removing=!removing;
 mode=null;
 preview=null;
 landMode=false;

 $("land").classList.remove("active");
 $("remove").classList.toggle(
  "active",removing
 );

 closePanel();

 toast(removing
  ?"Tap a building or road to remove"
  :"Removal mode off"
 );
};

$("land").onclick=()=>{
 landMode=!landMode;
 removing=false;
 mode=null;
 preview=null;

 closePanel();

 $("remove").classList.remove("active");
 $("land").classList.toggle(
  "active",landMode
 );

 toast(landMode
  ?"Tap highlighted adjoining land to purchase"
  :"Land mode off"
 );
};

$("pause").onclick=()=>{
 state.paused=!state.paused;
 refresh();
};

$("speed").onclick=()=>{
 state.speed=(state.speed+1)%SPEEDS.length;
 refresh();
};

// SAVE AND RESET

function save(msg=true){
 try{
  localStorage.setItem(
   KEY,
   JSON.stringify({
    state,camera,smoothRotation:true
   })
  );

  if(msg)toast("Game saved");
 }catch(e){
  toast("Save failed");
 }
}

$("save").onclick=()=>save();

$("reset").onclick=()=>{
 modal(
  "New game",
  "<p>Erase your current game and start again with £20m and a 50MW turbine?</p>",
  ()=>{
   state=fresh();
   camera=camFresh();

   selected=null;
   mode=null;
   preview=null;
   removing=false;
   landMode=false;
   panelMin=false;
   reportOpen=false;

   $("panel").style.display="none";
   $("menu").style.display="none";
   $("report").style.display="none";

   $("land").classList.remove("active");
   $("remove").classList.remove("active");

   acc=0;
   last=performance.now();

   save(false);
   refresh();
   toast("New game started");
  },
  "Reset"
 );
};

// LOAD EXISTING PROGRESS

try{
 const saved=JSON.parse(
  localStorage.getItem(KEY)
 );

 if(
  saved&&saved.state&&
  Array.isArray(saved.state.assets)
 ){
  state={...fresh(),...saved.state};
  camera={
   ...camFresh(),
   ...(saved.camera||{})
  };

  if(!saved.smoothRotation){
   camera.rot=(camera.rot||0)*Math.PI/2;
  }

  state.nextId=Math.max(
   state.nextId||0,
   ...state.assets.map(a=>a.id+1),
   5
  );

  if(!Array.isArray(state.roads))
   state.roads=starterRoads();

  if(!Array.isArray(state.owned))
   state.owned=["0,0","1,0","0,1","1,1"];

  if(!Array.isArray(state.history))
   state.history=[];

  if(!state.daily)
   state.daily={revenue:0,profit:0,export:0};
 }
}catch(e){
 console.warn("Save could not be loaded",e);
}

setInterval(()=>save(false),30000);

document.addEventListener("visibilitychange",()=>{
 if(document.hidden)save(false);
});

refresh();
requestAnimationFrame(draw);
requestAnimationFrame(loop);
</script>
</body>
</html>
