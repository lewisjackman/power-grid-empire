*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#10242c;color:#eaf3f4;font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}button,select{font:inherit;color:inherit;background:#254b59;border:1px solid #638591;border-radius:9px;padding:9px;touch-action:manipulation}button{font-weight:650}button.active{background:#d9b675;color:#142a34}#world{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:linear-gradient(#9bb7b5,#b8cdbd 65%,#83a18d)}header{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(9px + env(safe-area-inset-top)) 12px 10px;background:#10242cf2}h1{font-size:16px;margin:0}.sub{font-size:10px;color:#a8c1c8;margin-top:3px}#stats{text-align:right;white-space:nowrap;font-size:11px}#stats b{color:#f4d38c;font-size:16px}#bar{position:absolute;bottom:0;left:0;right:0;z-index:4;background:#10242c;padding:8px 8px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #4d707b}#clock{font-size:11px;color:#c3d7db;margin-bottom:7px}.toolbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.toolbar button{flex-shrink:0;font-size:11px;padding:11px}#panel,#menu,#report{position:absolute;z-index:5;background:#14313bee;border:1px solid #668691;border-radius:12px;padding:12px;box-shadow:0 6px 28px #0007}#panel{display:none;bottom:calc(109px + env(safe-area-inset-bottom));left:9px;right:9px;max-height:35vh;overflow:auto}#menu{display:none;bottom:calc(109px + env(safe-area-inset-bottom));left:9px;right:9px;max-height:55vh;overflow:auto}#report{display:none;top:calc(80px + env(safe-area-inset-top));bottom:calc(105px + env(safe-area-inset-bottom));left:9px;right:9px;overflow:auto}#panelHead{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:12px;align-items:start;border-bottom:1px solid #476673;padding-bottom:8px}#panelTitle{font-size:14px;overflow-wrap:anywhere;margin:5px 0;color:#f4d38c}#panelHead button{height:38px;padding:0;font-size:23px}#panelBody{line-height:1.5;font-size:12px;padding-top:8px}#panelActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}#panelActions button{font-size:11px}#menu h2,#report h2{margin:0 0 10px;font-size:16px}.option{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #3b5963}.option small{display:block;color:#b4cbd0;line-height:1.45;margin-top:4px}.option button{flex-shrink:0}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #36515b}.row span{color:#c5d8dc}.row b{text-align:right}.tabs{display:flex;gap:5px;margin-bottom:8px}.tabs button{flex:1;padding:8px;font-size:11px}.chart{width:100%;height:180px;background:#0c2630;border-radius:8px;display:block;margin:8px 0 15px}.chartTitle{font-size:12px;color:#f4d38c;margin-top:15px}#modalShade{display:none;position:absolute;inset:0;z-index:20;background:#07151cb9;align-items:center;justify-content:center;padding:20px}#modal{width:min(100%,410px);background:#173743;border:1px solid #83a0aa;border-radius:15px;padding:18px;box-shadow:0 15px 45px #0009}#modal h2{margin:0 0 10px;font-size:17px;color:#f2d18e}#modal p{line-height:1.55;color:#d4e3e7}#modalButtons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}#modalButtons button:last-child{background:#d9b675;color:#182c33}#toast{display:none;position:absolute;z-index:9;top:calc(80px + env(safe-area-inset-top));left:12px;right:12px;padding:10px;border:1px solid #688b95;border-radius:10px;background:#16343df2;font-size:12px;pointer-events:none}.muted{color:#a9c4cb}.good{color:#85e8b1}.bad{color:#ff9a98}.small{font-size:11px}.wide{width:100%;margin-top:10px}
</style></head><body><canvas id="world"></canvas><header><div><h1>⚡ Power Grid Empire</h1><div class="sub">Meridian Power · East Midlands · v0.5</div></div><div id="stats"></div></header><div id="toast"></div><div id="panel"><div id="panelHead"><h2 id="panelTitle"></h2><button id="panelClose">×</button></div><div id="panelBody"></div><div id="panelActions"></div></div><div id="menu"><h2>🏗 Development & infrastructure</h2><div id="options"></div><button id="menuClose" class="wide">Close</button></div><div id="report"><h2>📊 Management dashboard</h2><div class="tabs"><button data-tab="Operations">Operations</button><button data-tab="Finances">Finances</button><button data-tab="Assets">Assets</button></div><div id="reportBody"></div><button id="reportClose" class="wide">Close</button></div><div id="bar"><div id="clock"></div><div class="toolbar"><button id="build">🏗 Build</button><button id="analytics">📊 Analytics</button><button id="remove">🗑 Remove</button><button id="land">🌳 Land</button><button id="pause">⏸ Pause</button><button id="speed">⏩ 1×</button><button id="save">💾 Save</button><button id="reset">↺ Reset</button></div></div><div id="modalShade"><div id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalButtons"><button id="modalCancel">Cancel</button><button id="modalOK">Confirm</button></div></div></div>
<script>
'use strict';
const $=x=>document.getElementById(x),canvas=$('world'),ctx=canvas.getContext('2d'),N=24,TW=48,TH=25,KEY='pge-v02',SPEEDS=[1,4,12,48];
const TYPES={OCGT:{name:'Gas peaking turbine',cost:5,days:3,size:2,mw:20,desc:'Dispatchable gas generation. Needs a gas receiving station and grid transformer within eight tiles.',requires:['Gas','Grid'],color:'#9caeb8',height:22},Battery:{name:'Battery storage',cost:3,days:2,size:2,mw:10,desc:'10 MW / 20 MWh storage. Charges when prices are low and sells when prices are high. Needs a grid connection.',requires:['Grid'],color:'#d8d8c9',height:13},Gas:{name:'Gas receiving station',cost:1.2,days:2,size:2,desc:'Supplies gas to turbines within eight tiles.',requires:[],color:'#c6ae7a',height:12},Grid:{name:'Grid transformer',cost:2,days:3,size:2,desc:'Adds 80 MW export capacity and connects nearby generators and batteries.',requires:[],color:'#86a9ba',height:14},Office:{name:'Control building',cost:.5,days:1,size:2,desc:'Site control and administration. Currently optional.',requires:[],color:'#b5c8d2',height:17},Road:{name:'Access road',cost:.05,days:0,size:1,desc:'A single road tile. Access roads are cosmetic in this version.',requires:[],color:'#747c7b',height:0}};
const key=(x,y)=>x+','+y;
function starterRoads(){let r=[];for(let y=0;y<16;y++)r.push(key(2,y));for(let x=0;x<16;x++)r.push(key(x,9));for(let y=4;y<12;y++)r.push(key(10,y));return [...new Set(r)]}
function fresh(){return {cash:20,day:1,hour:8,price:115,revenue:0,fuel:0,carbon:0,opex:0,profit:0,gasMWh:0,batteryMWh:0,exportMWh:0,assets:[{id:1,type:'OCGT',x:5,y:5,mw:50,name:'Meridian OCGT 1',status:'operational',progress:0},{id:2,type:'Gas',x:3,y:7,name:'Gas receiving',status:'operational',progress:0},{id:3,type:'Grid',x:8,y:4,name:'Grid connection',status:'operational',progress:0},{id:4,type:'Office',x:3,y:3,name:'Control building',status:'operational',progress:0}],roads:starterRoads(),owned:[key(0,0),key(1,0),key(0,1),key(1,1)],nextId:5,paused:false,speed:0,history:[],daily:{revenue:0,profit:0,export:0},lastDay:null}}
function camFresh(){return {x:0,y:-20,zoom:.9,rot:0}}
let state=fresh(),camera=camFresh(),selected=null,mode=null,preview=null,removing=false,landMode=false,reportOpen=false,tab='Operations',period='day',panelMin=false,modalAction=null,acc=0,last=performance.now(),w=0,h=0,ratio=1,toastTimer;
function resize(){ratio=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);ctx.setTransform(ratio,0,0,ratio,0,0)}addEventListener('resize',resize);resize();
function rot(x,y){let dx=x-12,dy=y-12,c=Math.cos(camera.rot),s=Math.sin(camera.rot);return {x:dx*c-dy*s+12,y:dx*s+dy*c+12}}
function unrot(x,y){let dx=x-12,dy=y-12,c=Math.cos(camera.rot),s=Math.sin(camera.rot);return {x:dx*c+dy*s+12,y:-dx*s+dy*c+12}}
function proj(x,y,z=0){let p=rot(x,y);return {x:w/2+camera.x+(p.x-p.y)*TW/2*camera.zoom,y:h*.42+camera.y+(p.x+p.y)*TH/2*camera.zoom-z*camera.zoom}}
function tileAt(x,y){let u=(x-w/2-camera.x)/(TW/2*camera.zoom),v=(y-h*.42-camera.y)/(TH/2*camera.zoom),p=unrot((u+v)/2,(v-u)/2);return {x:Math.floor(p.x),y:Math.floor(p.y)}}
function polygon(points,fill,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function segment(a,b,color,lw=2){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=lw*camera.zoom;ctx.stroke()}
function prism(x,y,sx,sy,height,roof){const p=[[x,y],[x+sx,y],[x+sx,y+sy],[x,y+sy]],faces=[];for(let i=0;i<4;i++){let a=p[i],b=p[(i+1)%4],mid=rot((a[0]+b[0])/2,(a[1]+b[1])/2);faces.push({depth:mid.x+mid.y,pts:[proj(...a,0),proj(...b,0),proj(...b,height),proj(...a,height)],color:i%2?'#526b76':'#425b66'})}faces.sort((a,b)=>a.depth-b.depth);for(const f of faces)polygon(f.pts,f.color,'#334b54',.7);polygon(p.map(q=>proj(q[0],q[1],height)),roof,'#536c75',1)}
function tower(x,y,z){prism(x-.13,y-.13,.26,.26,z,'#d1d9d8')}
function building(a){let t=TYPES[a.type];if(!t)return;let p=a.progress||0,building=a.status==='building',stage=building?p:1;let height=t.height*Math.max(.08,stage);if(building){polygon([proj(a.x,a.y,1),proj(a.x+2,a.y,1),proj(a.x+2,a.y+2,1),proj(a.x,a.y+2,1)],'#c3b99a','#e5c787',1.5);if(stage<.18){for(let i=0;i<4;i++)segment(proj(a.x+.2+i*.45,a.y+.3,1),proj(a.x+.2+i*.45,a.y+1.7,1),'#7c837d',3)}}if(!building||stage>.18){prism(a.x+.15,a.y+.15,1.7,1.7,height,t.color);if(a.type==='OCGT'&&stage>.7){tower(a.x+1.42,a.y+.45,52*stage);tower(a.x+1.42,a.y+1.15,52*stage)}if(a.type==='Battery'&&stage>.6){prism(a.x+.25,a.y+.3,1.3,.5,height+2,'#eee9dc');prism(a.x+.25,a.y+1.15,1.3,.5,height+2,'#eee9dc')}if(a.type==='Grid'&&stage>.7){for(let i=0;i<3;i++)segment(proj(a.x+.3+i*.6,a.y+1.5,5),proj(a.x+.3+i*.6,a.y+1.5,25),'#d3d9d7',2)}}if(building){scaffold(a,stage)}if(selected===a.id){let p=proj(a.x+1,a.y+1,57);ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill()}}
function scaffold(a,p){let x=a.x,y=a.y,z=Math.max(8,TYPES[a.type].height*p+5);for(let xx of [x+.05,x+1.95])for(let yy of [y+.05,y+1.95]){segment(proj(xx,yy,0),proj(xx,yy,z),'#f5ca62',2)}for(let k=5;k<z;k+=7){let corners=[[x+.05,y+.05],[x+1.95,y+.05],[x+1.95,y+1.95],[x+.05,y+1.95]];for(let i=0;i<4;i++){let u=corners[i],v=corners[(i+1)%4];segment(proj(...u,k),proj(...v,k),'#e4bd62',1.5)}}let cx=x+2.45,cy=y+.2;segment(proj(cx,cy,0),proj(cx,cy,62),'#e4ae4e',3);segment(proj(cx-.3,cy,62),proj(cx+2.3,cy,62),'#e4ae4e',3);segment(proj(cx+1.8,cy,62),proj(cx+1.8,cy,26+Math.sin(state.hour)*3),'#d7c8a0',1);let pos=proj(x+1,y+1,65);ctx.fillStyle='#ffe5a0';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(Math.round(p*100)+'%',pos.x,pos.y);ctx.textAlign='left'}
function owned(x,y){return x>=0&&y>=0&&x<N&&y<N&&state.owned.includes(key(Math.floor(x/8),Math.floor(y/8)))}
function draw(){ctx.clearRect(0,0,w,h);let tiles=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++){let p=rot(x+.5,y+.5);tiles.push({x,y,depth:p.x+p.y})}tiles.sort((a,b)=>a.depth-b.depth);let roads=new Set(state.roads);for(let t of tiles){let own=owned(t.x,t.y),color=!own?'#8ca795':roads.has(key(t.x,t.y))?'#747d7b':(t.x+t.y)%2?'#729679':'#7c9d80';polygon([proj(t.x,t.y),proj(t.x+1,t.y),proj(t.x+1,t.y+1),proj(t.x,t.y+1)],color,'#587765',.5)}for(let blockKey of state.owned){let [bx,by]=blockKey.split(',').map(Number),x=bx*8,y=by*8;for(let i=0;i<8;i++)for(let side=0;side<4;side++){let tx=side===0?x+i:side===1?x+8:side===2?x+8-i:x,ty=side===0?y:side===1?y+i:side===2?y+8:y+8-i,ox=side===0?0:side===1?1:side===2?0:-1,oy=side===0?-1:side===1?0:side===2?1:0;if(owned(tx+ox,ty+oy))continue;let ax=tx,ay=ty,bx2=side%2?tx:tx+1,by2=side%2?ty+1:ty;segment(proj(ax,ay,3),proj(bx2,by2,3),'#e2e6d9',2);segment(proj(ax,ay,0),proj(ax,ay,9),'#d5dfd7',2)}}let assets=[...state.assets].sort((a,b)=>{let p=rot(a.x+1,a.y+1),q=rot(b.x+1,b.y+1);return p.x+p.y-q.x-q.y});for(let a of assets)building(a);if(mode&&preview){let t=TYPES[mode],valid=canPlace(mode,preview.x,preview.y),s=t.size;polygon([proj(preview.x,preview.y,2),proj(preview.x+s,preview.y,2),proj(preview.x+s,preview.y+s,2),proj(preview.x,preview.y+s,2)],valid?'#62f2a56b':'#ff686877',valid?'#8dffb9':'#ff8888',2);for(let req of t.requires){let good=hasService(req,preview.x,preview.y);for(let a of state.assets.filter(a=>a.type===req&&a.status==='operational')){let p=proj(a.x+1,a.y+1,3);ctx.beginPath();ctx.ellipse(p.x,p.y,8*TW*.43*camera.zoom,8*TW*.22*camera.zoom,-Math.PI/4,0,Math.PI*2);ctx.fillStyle=good?'#5fe5a015':'#ff62621a';ctx.fill();ctx.strokeStyle=good?'#55ec9e':'#ff7777';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.stroke();ctx.setLineDash([])}}}if(landMode){for(let bx=0;bx<3;bx++)for(let by=0;by<3;by++)if(!state.owned.includes(key(bx,by))&&adjacent(bx,by)){let x=bx*8,y=by*8;polygon([proj(x,y,2),proj(x+8,y,2),proj(x+8,y+8,2),proj(x,y+8,2)],'#eac86c28','#eac86c',2)}}requestAnimationFrame(draw)}
function canPlace(type,x,y){let s=TYPES[type].size;if(!owned(x,y)||!owned(x+s-1,y+s-1))return false;for(let a of state.assets){let z=TYPES[a.type].size;if(x<a.x+z&&x+s>a.x&&y<a.y+z&&y+s>a.y)return false}for(let xx=x;xx<x+s;xx++)for(let yy=y;yy<y+s;yy++)if(state.roads.includes(key(xx,yy)))return false;return true}
function adjacent(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>state.owned.includes(key(x+dx,y+dy)))}
function hasService(type,x,y){return state.assets.some(a=>a.type===type&&a.status==='operational'&&Math.abs(a.x-x)+Math.abs(a.y-y)<=8)}
function status(a){if(a.status==='building')return 'Under construction';if(a.type==='OCGT'&&!hasService('Gas',a.x,a.y))return 'No gas supply';if(['OCGT','Battery'].includes(a.type)&&!hasService('Grid',a.x,a.y))return 'No grid connection';return 'Operational'}
function gasMW(){return state.assets.filter(a=>a.type==='OCGT'&&status(a)==='Operational').reduce((n,a)=>n+(a.mw||20),0)}
function batteryMW(){return state.assets.filter(a=>a.type==='Battery'&&status(a)==='Operational').reduce((n,a)=>n+(a.mw||10),0)}
function gridMW(){return state.assets.filter(a=>a.type==='Grid'&&a.status==='operational').length*80}
function money(n){return (n<0?'−':'')+'£'+Math.abs(n).toFixed(3)+'m'}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function modal(title,html,yes,ok='Confirm'){modalAction=yes;$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modalOK').textContent=ok;$('modalShade').style.display='flex'}
function closeModal(){$('modalShade').style.display='none';modalAction=null}$('modalCancel').onclick=closeModal;$('modalOK').onclick=()=>{let action=modalAction;closeModal();if(action)action()};
function closePanel(){selected=null;panelMin=false;$('panel').style.display='none'}$('panelClose').onclick=()=>{if(mode){mode=null;preview=null}closePanel()};
function setPanel(title,html,actions=[]){$('panel').style.display='block';$('panelTitle').textContent=title;$('panelBody').innerHTML=html;let area=$('panelActions');area.replaceChildren();for(let item of actions){let b=document.createElement('button');b.textContent=item.text;b.onclick=item.fn;area.appendChild(b)}}
function assetPanel(){let a=state.assets.find(a=>a.id===selected);if(!a){closePanel();return}let t=TYPES[a.type],html='<p>'+t.desc+'</p><p>Status: <b>'+status(a)+'</b></p>';if(a.mw)html+='<p>Capacity: '+a.mw+' MW</p>';if(a.type==='Battery')html+='<p>Stored: '+(a.soc||0).toFixed(1)+' / 20 MWh</p>';if(a.status==='building')html+='<p>Construction: '+Math.round(a.progress*100)+'%</p>';if(panelMin){setPanel(a.name,'<p class="muted">'+(a.status==='building'?'Construction '+Math.round(a.progress*100)+'%':'Asset selected')+'</p>',[{text:'Show details',fn:()=>{panelMin=false;assetPanel()}},{text:'Close',fn:closePanel}])}else setPanel(a.name,html,[{text:'Minimise',fn:()=>{panelMin=true;assetPanel()}},{text:'Decommission',fn:()=>askDemolish(a)},{text:'Close',fn:closePanel}])}
function placementPanel(){if(!mode)return;let t=TYPES[mode],html='<p>'+t.desc+'</p><p>Cost: <b>'+money(t.cost)+'</b> · Build time: '+t.days+' days</p>';if(preview){html+='<p>Plot '+(preview.x+1)+', '+(preview.y+1)+': '+(canPlace(mode,preview.x,preview.y)?'<span class="good">Available</span>':'<span class="bad">Unavailable</span>')+'</p>';for(let req of t.requires)html+='<p class="'+(hasService(req,preview.x,preview.y)?'good':'bad')+'">● '+req+': '+(hasService(req,preview.x,preview.y)?'Connected':'Outside range')+'</p>'}else html+='<p>Tap a plot to choose a location.</p>';setPanel('🏗 '+t.name,html,[{text:'Cancel',fn:()=>{mode=null;preview=null;closePanel()}}])}
function askBuild(x,y){let t=TYPES[mode],type=mode,missing=t.requires.filter(req=>!hasService(req,x,y));modal('Confirm construction','<p><b>'+t.name+'</b> at plot '+(x+1)+', '+(y+1)+'</p><p>Capital cost: <b>'+money(t.cost)+'</b><br>Build time: '+t.days+' days</p><p class="'+(missing.length?'bad':'good')+'">'+(missing.length?'⚠ Missing services: '+missing.join(', '):'✓ Infrastructure requirements satisfied')+'</p>',()=>{if(!canPlace(type,x,y)||state.cash<t.cost){toast('Unable to place or afford project');return}state.cash-=t.cost;if(type==='Road'){state.roads.push(key(x,y));toast('Road built')}else{let id=state.nextId++;state.assets.push({id,type,x,y,name:t.name+' '+id,mw:t.mw||0,status:'building',progress:0,daysRequired:t.days,soc:0});selected=id;panelMin=true;toast('Construction started')}mode=null;preview=null;refresh();if(selected!==null)assetPanel();else closePanel();save(false)},'Build')}
function askDemolish(a){let v=a.status==='building'?-TYPES[a.type].cost*.08:TYPES[a.type].cost*.06;modal('Decommission asset','<p>'+a.name+'</p><p>'+(v>=0?'Net scrap proceeds: ':'Decommissioning cost: ')+'<b>'+money(Math.abs(v))+'</b></p><p>This action is irreversible. Removing gas or grid infrastructure can disconnect other assets.</p>',()=>{if(state.cash+v<0){toast('Insufficient funds');return}state.cash+=v;state.assets=state.assets.filter(b=>b.id!==a.id);closePanel();refresh();save(false);toast('Asset decommissioned')},'Decommission')}
function askRoad(x,y){modal('Remove road','<p>Remove road at plot '+(x+1)+', '+(y+1)+'?</p><p>Removal cost: <b>£0.010m</b></p>',()=>{if(state.cash<.01){toast('Insufficient cash');return}state.cash-=.01;state.roads=state.roads.filter(k=>k!==key(x,y));refresh();save(false)},'Remove')}
function selectTile(sx,sy){let p=tileAt(sx,sy),x=p.x,y=p.y;if(x<0||y<0||x>=N||y>=N)return;if(landMode){let bx=Math.floor(x/8),by=Math.floor(y/8),k=key(bx,by);if(state.owned.includes(k)){toast('Land already owned');return}if(!adjacent(bx,by)){toast('Buy an adjoining parcel first');return}let cost=2.5+state.owned.length*.75;modal('Acquire land','<p>Purchase an adjoining 8 × 8 parcel (64 tiles).</p><p>Price: <b>'+money(cost)+'</b></p><p>The perimeter fence will automatically expand around your new land.</p>',()=>{if(state.cash<cost){toast('Insufficient cash');return}state.cash-=cost;state.owned.push(k);landMode=false;$('land').classList.remove('active');refresh();save(false);toast('Land acquired')},'Buy land');return}let a=[...state.assets].reverse().find(a=>x>=a.x&&x<a.x+2&&y>=a.y&&y<a.y+2);if(removing){if(a)askDemolish(a);else if(state.roads.includes(key(x,y)))askRoad(x,y);else toast('Nothing to remove');return}if(mode){preview={x,y};placementPanel();if(canPlace(mode,x,y))askBuild(x,y);return}if(a){if(selected===a.id){closePanel();return}selected=a.id;panelMin=false;assetPanel()}else closePanel()}
function buildMenu(){$('options').innerHTML='';for(let [id,t] of Object.entries(TYPES)){let line=document.createElement('div');line.className='option';let info=document.createElement('div');let b=document.createElement('b');b.textContent=t.name;let d=document.createElement('small');d.textContent=t.desc;let meta=document.createElement('small');meta.textContent=money(t.cost)+' · '+t.days+' days'+(t.mw?' · '+t.mw+' MW':'');info.append(b,d,meta);let btn=document.createElement('button');btn.textContent='Build';btn.onclick=()=>{if(state.cash<t.cost){toast('Insufficient funds');return}mode=id;preview=null;selected=null;removing=false;landMode=false;$('remove').classList.remove('active');$('land').classList.remove('active');$('menu').style.display='none';placementPanel()};line.append(info,btn);$('options').appendChild(line)}}
function row(k,v){return '<div class="row"><span>'+k+'</span><b>'+v+'</b></div>'}
function historyFor(period){let all=state.history||[],size=period==='day'?48:period==='month'?48*30:48*365;let data=all.slice(-size);if(data.length>160){let stride=Math.ceil(data.length/160);data=data.filter((_,i)=>i%stride===0||i===data.length-1)}return data}
function plotChart(canvas,data,field,color,period){let cw=canvas.clientWidth||320,ch=180,r=Math.min(devicePixelRatio||1,2),c=canvas.getContext('2d');canvas.width=cw*r;canvas.height=ch*r;c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,cw,ch);let L=47,R=cw-12,T=15,B=ch-32;c.strokeStyle='#385460';c.fillStyle='#b6cbd0';c.font='10px system-ui';for(let i=0;i<4;i++){let y=T+(B-T)*i/3;c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke()}if(data.length<2){c.fillText('Waiting for historical data',L+10,ch/2);return}let vals=data.map(d=>Number(d[field])||0),min=Math.min(...vals),max=Math.max(...vals);if(max===min){max+=1;min-=1}let px=i=>L+i*(R-L)/(vals.length-1),py=v=>B-(v-min)/(max-min)*(B-T);c.fillStyle='#c4d8da';c.fillText(max.toFixed(Math.abs(max)<10?2:0),2,T+4);c.fillText(min.toFixed(Math.abs(min)<10?2:0),2,B);c.strokeStyle=color;c.lineWidth=2;c.beginPath();vals.forEach((v,i)=>i?c.lineTo(px(i),py(v)):c.moveTo(px(i),py(v)));c.stroke();let ticks=[0,Math.floor((data.length-1)/2),data.length-1];for(let i of ticks){let d=data[i],label=period==='day'?'D'+d.day+' '+String(Math.floor(d.hour)).padStart(2,'0')+':'+(d.hour%1?'30':'00'):period==='month'?'Day '+d.day:'Year '+(Math.floor((d.day-1)/365)+1);let x=px(i);c.fillStyle='#b6cbd0';c.textAlign=i===0?'left':i===data.length-1?'right':'center';c.fillText(label,x,B+16)}c.textAlign='left'}
function chart(title,field,color){return '<div class="chartTitle">'+title+'</div><canvas class="chart" data-field="'+field+'" data-color="'+color+'"></canvas>'}
function report(){if(!reportOpen)return;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab!=='Assets')html+='<div class="row"><span>History period</span><select id="period"><option value="day">Day (48 intervals)</option><option value="month">Month (30 days)</option><option value="year">Year (365 days)</option></select></div>';if(tab==='Operations'){html+=row('Wholesale price','£'+state.price.toFixed(0)+'/MWh')+row('Gas capacity',gasMW()+' MW')+row('Battery power',batteryMW()+' MW')+row('Grid export capacity',gridMW()+' MW')+row('Total exports',state.exportMWh.toFixed(1)+' MWh');html+=chart('Electricity price (£/MWh)','price','#e9c77d')+chart('Export (MWh per interval)','export','#7ce0ac')}else if(tab==='Finances'){html+=row('Cash',money(state.cash))+row('Revenue',money(state.revenue))+row('Fuel costs',money(state.fuel))+row('Carbon costs',money(state.carbon))+row('Operating profit',money(state.profit));html+=chart('Cash balance (£m)','cash','#86bffc')+chart('Cumulative profit (£m)','profit','#f1ae7e')+chart('Interval revenue (£m)','revenue','#b6e4f0')}else{html+=row('Land parcels',state.owned.length)+row('Road tiles',state.roads.length)+row('Assets',state.assets.length)+row('Under construction',state.assets.filter(a=>a.status==='building').length);for(let [k,t] of Object.entries(TYPES)){let n=state.assets.filter(a=>a.type===k).length;if(n)html+=row(t.name,n)}}$('reportBody').innerHTML=html;let picker=$('period');if(picker){picker.value=period;picker.onchange=v=>{period=v.target.value;report()}}let data=historyFor(period);for(let c of $('reportBody').querySelectorAll('canvas'))plotChart(c,data,c.dataset.field,c.dataset.color,period)}
function refresh(){let gas=state.assets.filter(a=>a.type==='OCGT').reduce((n,a)=>n+(a.mw||20),0),bat=state.assets.filter(a=>a.type==='Battery').length*10;$('stats').innerHTML='<b>'+money(state.cash)+'</b><br>'+gas+'MW gas · '+bat+'MW BESS';$('clock').textContent='Day '+state.day+' · '+String(Math.floor(state.hour)).padStart(2,'0')+':'+(state.hour%1?'30':'00')+' · Power £'+state.price.toFixed(0)+'/MWh · Grid '+gridMW()+'MW';$('pause').textContent=state.paused?'▶ Resume':'⏸ Pause';$('speed').textContent='⏩ '+SPEEDS[state.speed]+'×';if(reportOpen)report();if(selected!==null)assetPanel()}
function price(){return Math.max(-25,Math.min(270,100+45*Math.sin((state.hour-8)/24*Math.PI*2)+19*Math.cos(state.day*.12)-30*Math.sin(state.day*.39+state.hour*.08)+14*Math.sin(state.day*.87+state.hour*.53)))}
function step(){state.hour+=.5;if(state.hour>=24){state.hour=0;state.day++;state.lastDay={...state.daily};state.daily={revenue:0,profit:0,export:0}}state.price=price();let gas=state.price>86?Math.min(gasMW(),gridMW()):0,remaining=Math.max(0,gridMW()-gas),charge=0,discharge=0;for(let a of state.assets.filter(a=>a.type==='Battery'&&status(a)==='Operational')){let soc=a.soc||0;if(state.price<65){let bought=Math.max(0,Math.min(5,(20-soc)/.9));a.soc=Math.min(20,soc+bought*.9);charge+=bought}else if(state.price>125&&remaining>0){let sold=Math.max(0,Math.min(5,remaining*.5,soc*.9));a.soc=Math.max(0,soc-sold/.9);discharge+=sold;remaining-=sold/.5}}let gen=gas*.5,exp=gen+discharge,rev=exp*state.price/1e6,fuel=gen*55/1e6,carbon=gen*23/1e6,opex=gen*8/1e6+state.assets.filter(a=>a.status==='operational').length*120/1e6+charge*state.price/1e6,profit=rev-fuel-carbon-opex;state.revenue+=rev;state.fuel+=fuel;state.carbon+=carbon;state.opex+=opex;state.profit+=profit;state.cash+=profit;state.gasMWh+=gen;state.batteryMWh+=discharge;state.exportMWh+=exp;state.daily.revenue+=rev;state.daily.profit+=profit;state.daily.export+=exp;for(let a of state.assets)if(a.status==='building'){a.progress+=.5/((a.daysRequired||TYPES[a.type].days)*24);if(a.progress>=1){a.progress=1;a.status='operational';toast(a.name+' completed')}}state.history.push({day:state.day,hour:state.hour,price:state.price,export:exp,cash:state.cash,profit:state.profit,revenue:rev});if(state.history.length>17520)state.history.splice(0,state.history.length-17520)}
function loop(now){let dt=Math.min((now-last)/1000,2);last=now;if(!state.paused){acc+=dt*SPEEDS[state.speed];let count=0;while(acc>=1&&count<100){step();acc--;count++}if(count)refresh()}requestAnimationFrame(loop)}
const pointers=new Map();let moved=false,multi=false,start=null,oldDist=0,oldCentre=null,oldAngle=null;
function point(e){let r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function gestureReset(){oldDist=0;oldCentre=null;oldAngle=null}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);let p=point(e);pointers.set(e.pointerId,p);if(pointers.size===1){moved=false;multi=false;start=p;gestureReset()}if(pointers.size>1){multi=true;gestureReset()}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=point(e),old=pointers.get(e.pointerId);pointers.set(e.pointerId,p);if(pointers.size===1){if(start&&Math.hypot(p.x-start.x,p.y-start.y)>6)moved=true;camera.x+=p.x-old.x;camera.y+=p.y-old.y}else if(pointers.size===2){multi=true;moved=true;let v=[...pointers.values()],dist=Math.hypot(v[1].x-v[0].x,v[1].y-v[0].y),centre={x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2},angle=Math.atan2(v[1].y-v[0].y,v[1].x-v[0].x);if(oldDist>0)camera.zoom=Math.max(.45,Math.min(2.2,camera.zoom*dist/oldDist));if(oldCentre){camera.x+=centre.x-oldCentre.x;camera.y+=centre.y-oldCentre.y}if(oldAngle!==null){let delta=angle-oldAngle;camera.rot+=Math.atan2(Math.sin(delta),Math.cos(delta))}oldDist=dist;oldCentre=centre;oldAngle=angle}});
function endPointer(e){if(pointers.has(e.pointerId)&&pointers.size===1&&!moved&&!multi&&e.type==='pointerup'){let p=point(e);selectTile(p.x,p.y)}pointers.delete(e.pointerId);gestureReset();if(!pointers.size){start=null;moved=false;multi=false}}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
$('build').onclick=()=>{let open=$('menu').style.display!=='block';$('menu').style.display=open?'block':'none';$('report').style.display='none';reportOpen=false;if(open)buildMenu()};$('menuClose').onclick=()=>$('menu').style.display='none';$('analytics').onclick=()=>{reportOpen=!reportOpen;$('report').style.display=reportOpen?'block':'none';$('menu').style.display='none';if(reportOpen)report()};$('reportClose').onclick=()=>{reportOpen=false;$('report').style.display='none'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;report()});$('remove').onclick=()=>{removing=!removing;mode=null;preview=null;landMode=false;$('land').classList.remove('active');$('remove').classList.toggle('active',removing);closePanel();toast(removing?'Tap a building or road to remove':'Removal mode off')};$('land').onclick=()=>{landMode=!landMode;removing=false;mode=null;preview=null;closePanel();$('remove').classList.remove('active');$('land').classList.toggle('active',landMode);toast(landMode?'Tap a highlighted adjoining parcel to buy':'Land mode off')};$('pause').onclick=()=>{state.paused=!state.paused;refresh()};$('speed').onclick=()=>{state.speed=(state.speed+1)%SPEEDS.length;refresh()};
function save(msg=true){try{localStorage.setItem(KEY,JSON.stringify({state,camera,smoothRotation:true}));if(msg)toast('Game saved')}catch(e){toast('Save failed')}}$('save').onclick=()=>save();$('reset').onclick=()=>modal('New game','<p>Erase your existing game and start again with £20m and a 50MW gas turbine?</p>',()=>{state=fresh();camera=camFresh();selected=null;mode=null;preview=null;removing=false;landMode=false;panelMin=false;reportOpen=false;$('panel').style.display='none';$('menu').style.display='none';$('report').style.display='none';$('land').classList.remove('active');$('remove').classList.remove('active');acc=0;last=performance.now();save(false);refresh();toast('New game started')},'Reset');
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.state&&Array.isArray(saved.state.assets)){state={...fresh(),...saved.state};camera={...camFresh(),...(saved.camera||{})};if(!saved.smoothRotation)camera.rot=(camera.rot||0)*Math.PI/2;state.nextId=Math.max(state.nextId||0,...state.assets.map(a=>a.id+1),5);if(!Array.isArray(state.roads))state.roads=starterRoads();if(!Array.isArray(state.owned))state.owned=[key(0,0),key(1,0),key(0,1),key(1,1)];if(!Array.isArray(state.history))state.history=[];if(!state.daily)state.daily={revenue:0,profit:0,export:0}}}catch(e){console.warn('Save could not be loaded',e)}
setInterval(()=>save(false),30000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save(false)});refresh();requestAnimationFrame(draw);requestAnimationFrame(loop);
</script></body></html>
