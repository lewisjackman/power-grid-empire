#panelHead{align-items:flex-start}
#panelTitle{flex:1;min-width:0;overflow-wrap:anywhere}
#panelClose{position:static;flex:0 0 44px;min-height:44px;padding:0}
#businessDesk{--ink:#e7eff0;--soft:#a5babc;--accent:#a7e7c5;--line:#35525a;color:var(--ink);background:#10252d;border:1px solid var(--line);border-radius:21px;padding:0;width:min(740px,calc(100vw - 20px));max-height:min(840px,calc(100dvh - 24px));box-sizing:border-box;box-shadow:0 24px 80px #0008;font:15px/1.45 Inter,system-ui,sans-serif;overflow:auto;overscroll-behavior:contain}
#businessDesk::backdrop{background:#03121ab0}
#businessDesk h2,#businessDesk h3{line-height:1.14}
#businessDesk h3{margin:21px 0 10px;font-size:17px}
#businessDesk p{margin:9px 0;color:var(--soft)}
#deskHeader{position:sticky;top:0;z-index:2;background:#10252df5;border-bottom:1px solid var(--line);padding:10px 16px 0}
.desk-titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.desk-titlebar strong{font-size:15px}
#deskClock{font:12px ui-monospace,monospace;color:#b0c6c7;margin-left:auto;white-space:nowrap}
#deskClose{width:44px;padding:0;font-size:25px;font-weight:400;background:transparent}
#deskNav{display:flex;gap:5px;overflow-x:auto;padding:3px 0 7px}
#businessDesk button{min-height:44px;cursor:pointer;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:#1c3941;padding:7px 12px;font-size:13px}
#businessDesk button:focus-visible,#businessDesk input:focus-visible,#businessDesk select:focus-visible{outline:2px solid #f3cc78;outline-offset:2px}
#deskNav button{white-space:nowrap}
#businessDesk button.selected{background:#2c514e;border-color:#8bd1ad;color:#e8ffe8}
#businessDesk button.primary{background:var(--accent);border-color:var(--accent);color:#0d2824;font-weight:750}
#deskBody{padding:16px 16px 4px}
#deskStatus{padding:0 16px 9px;color:#ffcf88!important}
#deskStatus:empty{display:none}
.desk-hero{background:linear-gradient(132deg,#234549,#1b353b 52%,#2e4035);border:1px solid #42645e;border-radius:15px;padding:17px}
.desk-hero small,.price-title span,.desk-metrics small,.investment-grid small{color:#b1c7c8}
.desk-hero h2{font-size:clamp(25px,5.5vw,42px);letter-spacing:-.035em;margin:7px 0}
.desk-heading h2{margin:0;font-size:25px;letter-spacing:-.02em}
.desk-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.desk-metrics article,.investment-grid article{border:1px solid var(--line);background:#162f37;border-radius:11px;padding:10px;min-width:0}
.desk-metrics strong{display:block;font-size:clamp(13px,3.5vw,24px);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.desk-metrics small{display:block;font-size:11px}
.objectives{display:grid;gap:5px}
#businessDesk .objectives button{display:flex;align-items:center;text-align:left;gap:10px}
.objectives span{background:#284b44;color:#b2f4cf;border-radius:50%;display:grid;place-items:center;width:25px;height:25px;flex-shrink:0}
.objectives b{margin-left:auto}
.desk-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#businessDesk label{display:grid;gap:4px;font-size:12px;color:#c4d1d1;min-width:0}
#businessDesk input,#businessDesk select{height:44px;box-sizing:border-box;font-size:16px;background:#1d3c44;color:var(--ink);border:1px solid #52717a;border-radius:8px;padding:5px 8px;width:100%;min-width:0}
.desk-fields,.investment-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.investment-grid article h3{margin:6px 0}
.investment-grid article p{font-size:12px}
.price-chart{display:flex;align-items:end;gap:2px;overflow-x:auto;padding:4px 0 8px}
#businessDesk .price-chart button{padding:2px 0;min-width:33px;display:grid;justify-items:center;background:#172e35;border-color:transparent}
.price-chart i{width:13px;background:#75aebb;border-radius:3px}
.price-chart .chosen i{background:#a7e7c5}
.price-chart small{font-size:10px}
.price-title{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.estimate{color:#bdf1d4!important;font-weight:700}
.table-scroll{overflow:auto}
#businessDesk table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
#businessDesk th,#businessDesk td{text-align:left;padding:8px 6px;border-bottom:1px solid #334d55}
#businessDesk th{color:#abc6c6}
#businessDesk .desk-note{font-size:12px}
@media(max-width:480px){#deskBody{padding:12px 11px 4px}#deskHeader{padding-left:11px;padding-right:11px}}

.daily-bars{display:grid;gap:4px}
.daily-bars div{display:grid;grid-template-columns:32px minmax(0,1fr) 92px;align-items:center;gap:8px;font-size:12px}
.daily-bars i{width:var(--amount);height:10px;background:#80ceaa;border-radius:3px}
.daily-bars i.negative{background:#f2aa89}
.daily-bars b{text-align:right;font-variant-numeric:tabular-nums}

let state=fresh(),camera=freshCamera(),selected=null,mode=null,preview=null,removing=false,landMode=false,reportOpen=false,tab='Operations',period='day',panelMin=false,modalAction=null,acc=0,last=performance.now(),w=0,h=0,ratio=1,toastTimer,uiDirty=true,chartDirty=true;

// World coordinates are never rotated. Only the camera projection rotates them.

function createStructureRenderer(){

  precision mediump float;
  varying vec3 tint;

function box3(x,y,sx,sy,z,height,roof,wall='#597480'){
 const b=[[x,y,z],[x+sx,y,z],[x+sx,y+sy,z],[x,y+sy,z]],t=b.map(p=>[p[0],p[1],z+height]);

function scheduleAutoDayAhead(){

  let start=0;
  while(start<24){
   const available=h=>prices[h]>=120&&!orderAt(a.id,day,h)&&
    !f.maintenance.some(m=>m.asset===a.id&&absoluteWindow(m).start<=day*48+h*2&&absoluteWindow(m).end>day*48+h*2)&&
    !f.capacity?.events?.some(e=>e.day===day&&h>=e.start&&h<e.start+2);
   if(!available(start)){start++;continue;}
   let end=start+1;
   while(end<24&&available(end))end++;
   const mw=Math.min(power(a),...prices.slice(start,end).map((_,i)=>{
    const h=start+i;
    return gridMW()-f.orders.filter(o=>o.day===day&&o.market==='sell'&&o.start<=h&&h<o.end).reduce((n,o)=>n+o.mw,0);
   }));
   if(end-start>=2&&mw>0&&prices.slice(start,end).reduce((n,p)=>n+(p-runCost())*mw,0)>startup){
    f.orderSeq=(f.orderSeq||0)+1;
    f.orders.push({id:f.orderSeq,asset:a.id,day,start,end,mw,market:'sell',price:prices,auto:true});
   }
   start=end;
  }
 }
}

function step(){

  state.hour=0;state.day++;state.daily={revenue:0,profit:0,export:0};
  f.orders=f.orders.filter(o=>o.day>=state.day);
  f.maintenance=f.maintenance.filter(m=>!m.completed||m.day>=state.day-7);
  if(seasonIndex()!==f.quarter.index){
   if(f.nextDifficulty){f.difficulty=f.nextDifficulty;delete f.nextDifficulty;postMessage('Difficulty updated','This quarter starts on '+f.difficulty+'. Existing loan rates are unchanged.','report');}
   closeQuarter();
   if(openRenewal()){f.pendingMidnight=true;showcaseStop=true;save(false);return;}
  }
  f.journal=f.journal.filter(o=>o.day>=state.day-3);
 }
 state.price=powerPrice(state.day,state.hour);
 if(state.hour===tradingGate)scheduleAutoDayAhead();
 advanceProjects();applyServiceReturns();

 const interest=serviceDebt();

 const sum=(name)=>records.reduce((n,r)=>n+r[name],0);

 state.profit+=profit/1e6;state.cash+=(profit+incidental)/1e6;state.gasMWh+=gen;state.batteryMWh+=exp-gen;state.exportMWh+=exp;

function save(message=true){
 try{
  const payload={state,camera,smoothRotation:true};
  let encoded=JSON.stringify(payload), trimmed=false;
  // Keep clear of the browser's storage limit as analytics accumulate.
  if(encoded.length>1_800_000){
   const f=finance();
   const compact={...state,history:state.history.slice(-1440),showcase:{...f,archives:(f.archives||[]).slice(-1)}};
   encoded=JSON.stringify({...payload,state:compact});
   trimmed=true;
  }
  try{
   localStorage.setItem(KEY,encoded);
  }catch(error){
   if(error.name!=='QuotaExceededError'&&error.name!=='NS_ERROR_DOM_QUOTA_REACHED')throw error;
   const f=finance();
   const compact={...state,history:state.history.slice(-48),showcase:{...f,archives:[]}};
   localStorage.setItem(KEY,JSON.stringify({...payload,state:compact}));
   trimmed=true;
  }
  if(message)toast(trimmed?'Game saved. Older chart history was trimmed from this save.':'Game saved');
  saveFailureReported=false;
 }catch(error){
  if(message||!saveFailureReported)toast('Couldn’t save on this browser. Keep this tab open and try Save game again. Your last successful save is still stored if browser storage is available.');
  saveFailureReported=true;
 }
}

function forecastPortfolio(overrides=new Map(),index=seasonIndex()){
 const live=state,source=finance();
 const assets=JSON.parse(JSON.stringify(live.assets));
 const profile=assetsForDispatch().map(a=>[a.id,overrides.has(a.id)?overrides.get(a.id):seasonPlan(a)]);
 const totals=Object.fromEntries(profile.map(([id])=>[id,emptyTotals()]));
 const sampleDays=[8,25,45,65,83];
 try{
  for(const offset of sampleDays){
   state={...live,assets:JSON.parse(JSON.stringify(assets)),day:index*90+offset,hour:17};
   const f=state.showcase={difficulty:source.difficulty,overheadPlan:source.overheadPlan,career:source.career,orders:[],journal:[],capital:[],maintenance:[],capacity:null};
   for(const [id,plan] of profile){
    const a=state.assets.find(x=>x.id===id);
    a.dispatchMode=plan?'Manual':'Auto';
    a.plan=plan?{...plan,season:index}:null;
    a.running=false;a.runTicks=0;a.soc=0;a.failureUntil=0;a.emergencyCost=0;
   }
   // Include commitment formation before processing the delivery day.
   scheduleAutoDayAhead();state.day++;
   for(let tick=0;tick<48;tick++){
    state.hour=tick/2;state.price=powerPrice(state.day,state.hour);
    for(const r of tradeInterval().records){
     const t=totals[r.asset];if(!t)continue;
     t.wholesale+=(r.da+r.spot)/sampleDays.length;
     t.balance+=r.bm/sampleDays.length;
     t.cost-=(r.fuel+r.carbon+r.operatingCost+r.start+r.importCost+r.serviceCost)/sampleDays.length;
     t.settlement-=(r.short+r.penalty)/sampleDays.length;
     t.export+=r.out/sampleDays.length;t.charge+=r.charge/sampleDays.length;
     t.downtime+=(r.offline?.5:0)/sampleDays.length;
    }
   }
  }
 }finally{state=live;}

}
function gridPlanWarning(overrides){

  let exp=0,imp=0;
  for(const a of assetsForDispatch().filter(operating)){
   const plan=overrides.has(a.id)?overrides.get(a.id):seasonPlan(a);
   const v=plan?plan.hours[h]:autoHours(a)[h];
   exp+=Math.max(v,0);imp+=Math.max(-v,0);
  }
  if(exp>limit+.001||imp>limit+.001)violations.push([h,Math.max(exp-limit,imp-limit)]);
 }
 if(!violations.length)return '';
 return 'Grid limit: up to '+Math.max(...violations.map(x=>x[1])).toFixed(1)+' MW above '+limit+' MW at '+violations.map(x=>hours(x[0])).join(', ')+'.';
}

function seasonalAction(action){
 const d=dispatchDraft??=newDraft(),g=scopeAssets(),f=finance();
 if(!g.length)return 'Choose a group with operating assets.';
 if(action!=='season-apply'){d.acknowledged=false;}
 if(action==='season-manual')d.editing=true;
 else if(action==='season-auto'){
  markTutorial('trade');if(g.some(a=>a.type==='Battery'))markTutorial('battery');
  const ids=new Set(g.map(a=>a.id));
  for(const a of g){a.dispatchMode='Auto';delete a.plan;}
  f.orders=f.orders.filter(o=>!ids.has(o.asset));
  dispatchDraft=null;if(!f.quarter?.intervals)f.quarter=forecastQuarter();
 }else if(action==='season-optimise'){
  d.editing=true;
  const gas=g.find(a=>a.type==='OCGT'),battery=g.find(a=>a.type==='Battery');
  if(gas)d.gas=autoHours(gas).map(Boolean);
  if(battery)d.battery=autoHours(battery).map(Math.sign);
  if(gas){
   let best=-Infinity;
   for(const offer of [135,149,163,177]){
    const overrides=new Map(g.map(a=>[a.id,projectedPlan(a,{...d,offer})]));
    const forecast=forecastPortfolio(overrides);
    const profit=g.reduce((n,a)=>n+currencyTotal(forecast[a.id]),0);
    if(profit>best){best=profit;d.offer=offer;}
   }
  }
 }else if(action==='season-clear'){d.gas=slot();d.battery=slot();}
 else if(action==='season-apply'){
  if(!d.editing)return;
  if(g.some(a=>a.type==='OCGT')&&(!d.gas.some(Boolean)||d.offer<40))return 'Select gas dispatch hours and set a balancing offer. Switch to Auto to exit without a manual plan.';
  if(g.some(a=>a.type==='Battery')&&(!d.battery.includes(-1)||!d.battery.includes(1)))return 'Set both battery charge and discharge hours.';
  const proposed=new Map(g.map(a=>[a.id,projectedPlan(a,d)]));
  const warning=gridPlanWarning(proposed);
  if(warning&&!d.acknowledged){d.acknowledged=true;return warning+' Adjust your selected hours or tap Apply again to accept likely curtailment.';}
  const ids=new Set(g.map(a=>a.id));
  f.orders=f.orders.filter(o=>!ids.has(o.asset));
  for(const a of g){a.dispatchMode='Manual';a.plan=proposed.get(a.id);}
  if(!f.quarter?.intervals)f.quarter=forecastQuarter();
  f.traded=true;markTutorial('trade');if(g.some(a=>a.type==='Battery'))markTutorial('battery');d.editing=false;deskStatus='Seasonal plan applied.';
 }else if(action.startsWith('hour-')&&d.editing){
  const [,kind,raw]=action.split('-'),h=Number(raw);
  if(kind==='gas')d.gas[h]=!d.gas[h];

 }
 return '';
}

function scheduleDelegatedMaintenance(){

  (a.failureUntil||0)<=absoluteNow()&&!scheduled.some(m=>m.asset===a.id))
  .sort((a,b)=>condition(a)-condition(b))[0];

 const profile=condition(asset)<40?serviceProfiles.major:serviceProfiles.routine;
 if(state.cash-profile.cost/1e6<5||reserveCash()<5)return;
 const events=f.capacity?.awards?.some(a=>a.asset===asset.id)?f.capacity.events||[]:[];

 for(let day=state.day+1;day<=state.day+3;day++){
  for(let start=0;start<24;start++){
   const from=day*48+start*2,end=from+profile.ticks;
   if(events.some(e=>from<(e.day*48+e.start*2+4)&&end>e.day*48+e.start*2))continue;
   if(scheduled.some(m=>overlapping({start:from,end},absoluteWindow(m))))continue;
   const plan=seasonPlan(asset)?.hours||autoHours(asset);
   let score=0;
   for(let t=from;t<end;t++){
    const hour=Math.floor(t%48/2),price=powerPrice(Math.floor(t/48),hour);
    if(orderAt(asset.id,Math.floor(t/48),hour)?.market==='sell')score+=1e6;
    score+=Math.max(0,plan[hour])*Math.max(0,price-(asset.type==='OCGT'?runCost():70))/2;
   }
   if(!best||score<best.score)best={day,start,end,score};
  }
 }
 if(!best||best.score>=1e6)return;
 f.maintenanceSeq=(f.maintenanceSeq||0)+1;
 f.maintenance.push({id:f.maintenanceSeq,asset:asset.id,day:best.day,start:best.start,until:best.end,cost:profile.cost,restore:profile.restore,label:profile.label,delegated:true});

function simulateAuction(player,demand,priceShift=0){

 const bids=[...auctionSupply().map(x=>({...x,price:x.price+priceShift})),...player.filter(x=>x.mw>0)].sort((a,b)=>a.price-b.price);

  const mw=Math.min(remaining,b.mw);remaining-=mw;price=b.price;
  if(b.asset&&mw>0)awards.push({...b,mw});

}

function optimiseCapacityBid(){

 let best=null;

  let remaining=gridMW();
  const portfolio=assets.map(a=>{
   const mw=Math.floor(2*Math.min(remaining,capacityLimit(a)*share*condition(a)/100))/2;
   remaining-=mw;
   return {asset:a.id,name:a.name,mw};
  });
  if(!portfolio.some(a=>a.mw>0))continue;
  for(let price=10;price<=75;price++){
   const player=portfolio.map(a=>({...a,price}));
   const forecasts=Array.from({length:5},(_,i)=>simulateAuction(player,auctionDemand(i),(i-2)*3));
   if(forecasts.filter(result=>result.awards.length).length<4)continue;
   const score=forecasts.reduce((total,result)=>total+result.income,0);
   if(!best||score>best.score)best={player,price,score};
  }
 }
 if(!best){$('auctionQuote').textContent='No eligible bid found for the current plant and grid connection.';return;}
 $('auctionPrice').value=best.price;
 for(const bid of best.player)$('cap-'+bid.asset).value=bid.mw;

}

function loanSchedule(l,days=Infinity){
 let balance=l.balance,total=0,interest=0,principal=0;
 for(let i=0;i<l.remaining&&l.next+i*30<=state.day+days;i++){
  const paid=Math.min(balance,l.amount/(l.term||12)),fee=balance*l.rate/12;
  total+=paid+fee;principal+=paid;interest+=fee;balance=Math.max(0,balance-paid);
 }
 return {total,interest,principal};
}
function loanDue(days=90){return (finance().loans||[]).reduce((n,l)=>n+loanSchedule(l,days).total,0);}
function serviceDebt(){
 if(state.hour!==0)return 0;
 let interest=0;
 for(const l of finance().loans||[]){
  while(l.remaining>0&&state.day>=l.next){
   const principal=Math.min(l.balance,l.amount/(l.term||12)),fee=l.balance*l.rate/12;
   l.balance=Math.max(0,l.balance-principal);l.remaining--;l.next+=30;
   state.cash-=principal;interest+=fee*1e6;
  }
 }
 return interest;
}

function doDesk(action){
 const f=finance();
 deskStatus='';
 if(f.dismissed&&action!=='close'&&action!=='restart-company')return 'Your term as CEO has ended. Start a new company to play again.';
 const locked=tutorialGate(action);if(locked)return locked;
 if(action==='restart-company'){$('reset').click();return;}
 if(action.startsWith('construction-')){const project=state.assets.find(a=>a.id===Number(action.slice(13)));if(project?.status==='building')toggleConstruction(project);return;}
 if(action==='delegate-maintenance'){
  if(tutorialGate('tab-plant'))return tutorialGate('tab-plant');

 }
 if(action.startsWith('gas-upgrade-')){

  const station=gasStations().find(a=>a.id===Number(action.slice(12)));
  if(!station||station.gasUpgradeDay||state.cash<1.5)return 'An operating station and £1.5m cash are required.';
  dialog('Upgrade gas receiving station?','<p>Pay £1.5m now for 100 MW of extra fuel import capacity in two days.</p>',()=>{
   if(state.cash<1.5||station.gasUpgradeDay||!gasStations().includes(station))return;
   state.cash-=1.5;recordCapital('Gas receiving upgrade',1.5);station.gasUpgradeDay=state.day+2;reviewBoard();uiDirty=true;save(false);renderDesk();
  },'Approve upgrade');return;
 }
 if(action==='bank-borrow')return requestBankLoan();
 if(action.startsWith('overhead-')){
  const plan=action.slice(9);
  if(!Object.hasOwn(overheadPlans,plan))return 'Choose an overhead budget.';
  f.overheadPlan=plan;
  if(!f.quarter?.intervals)f.quarter=forecastQuarter();
  return;
 }
 if(action.startsWith('repay-loan-'))return repayLoan(Number(action.slice(11)));
 if(!hasChosenCEO()&&!/^ceo-[0-8]$/.test(action))return 'Pick your CEO avatar to continue.';
 if(needsDifficulty()&&!action.startsWith('difficulty-'))return 'Choose a difficulty to continue.';
 if(action==='skip-winter'||/^(story-|develop-|career-|event-frequency-)/.test(action))return careerAction(action);
 const research={'build-Battery':'storage','build-OCGT':'generation','upgrade':'grid','site-land':'land'}[action];
 if(research&&tutorialFinished()&&!developmentHas(research)&&!(action==='build-Battery'&&finance().tutorialSkipped))return 'Unlock this option in Company → Development.';
 if(action.startsWith('tutorial-'))return tutorialAction(action);
 if(action.startsWith('winter-'))return winterAction(action);
 if(action.startsWith('brush-')){paintedHour=action.slice(6);return;}
 if(action.startsWith('season-')||action.startsWith('hour-'))return seasonalAction(action);
 if(action.startsWith('variance-')){waterfallDetail=action.slice(9);return;}
 if(deskTab==='dispatch'&&dispatchPending()&&(action.startsWith('tab-')||action==='close'||action==='rotate'))return 'Apply the manual plan or switch the remaining manual assets to Auto first.';
 if(action==='site-land'||action==='site-remove'){
  desk.close();$(action==='site-land'?'land':'remove').click();return;
 }
 if(action.startsWith('manual-advice-')){
  const i=Number(action.slice(14)),note=advisorNotes()[i];
  if(!note)return;
  if(i===0)preferredServiceAsset=assetsForDispatch().filter(operating).sort((a,b)=>condition(a)-condition(b))[0]?.id??null;
  if(i===2&&!state.assets.some(a=>a.type==='Battery'))return doDesk('build-Battery');
  if(i===5){
   const a=assetsForDispatch().filter(operating).sort((a,b)=>condition(b)-condition(a)||power(b)-power(a))[0];
   preferredCapacityBid=a?{asset:a.id,mw:Math.floor(Math.min(gridMW(),capacityLimit(a)*.8)*2)/2,price:26}:null;
  }
  if(i===1)dispatchDraft=null;
  deskTab=note.target;return;
 }
 if(action.startsWith('advice-')){
  const recommendation=quickAdvice(Number(action.slice(7)));
  return recommendation?recommendation.apply():'That recommendation is no longer available.';
 }
 const handled=handleBusiness(action);if(handled!==null)return handled;
 if(action.startsWith('tab-')){
  deskTab=action==='tab-build'?'build':action.slice(4);
  if(deskTab==='plant')f.reviewed=true;
  if(deskTab==='capital')f.appraised=true;
 }else if(action==='close'||action==='rotate'){
  if(action==='rotate')camera.rot+=Math.PI/4;
  desk.close();return;
 }else if(action.startsWith('build-')){
  const type=action.slice(6);
  if(state.cash<TYPES[type].cost*(type==='Road'?1:.2))return 'Cash is below the required deposit.';
  mode=type;preview=null;removing=false;landMode=false;selected=null;
  $('remove').classList.remove('active');$('land').classList.remove('active');
  desk.close();placementPanel();return;
 }else if(action==='upgrade'){
  const grid=state.assets.find(a=>a.type==='Grid'&&a.status==='operational');
  if(!grid||f.upgrade||state.cash<2)return 'The upgrade needs an operating transformer and £2m in cash.';
  state.cash-=2;recordCapital('Transformer upgrade',2);
  f.upgrade={asset:grid.id,day:state.day+2};deskStatus='Upgrade approved. Commissioning on day '+f.upgrade.day+'.';
 }else if(action.startsWith('service-cancel-')){
  const id=Number(action.slice(15));f.maintenance=f.maintenance.filter(m=>m.id!==id||absoluteWindow(m).start<=absoluteNow());
 }else if(action==='advance-tick')advance(1);
 else if(action==='advance-day')advance(48);
 else if(action==='advance-week')advance(336);

}

function reviewBoard(){
 const f=finance(),cash=reserveCash();

 if(state.cash<1&&!f.dismissed){
  if(f.cashCrisisDay===undefined){
   f.cashCrisisDay=state.day;
   postMessage('CFO · emergency cash warning','Cash is below £1m. The board will dismiss you at the start of day '+(state.day+2)+' unless you restore cash to at least £1m. '+cashRecoveryAdvice(),'financing','cash-emergency');
   state.paused=true;openDesk('messages');showcaseStop=true;save(false);return;
  }
  if(state.day<f.cashCrisisDay+2)return;
  f.dismissed={day:state.day,cash:state.cash};state.paused=true;showcaseStop=true;
  postMessage('Board decision · CEO dismissed','Cash fell below £1m. Your term as CEO has ended. Review your final position before starting a new company.','dismissed','board-dismissal');
  openDesk('dismissed');save(false);return;
 }
 const band=cash<5?3:cash<10?2:cash<17?1:0;
 if(band!==f.boardBand){
  if(band> (f.boardBand||0))for(let level=(f.boardBand||0)+1;level<=band;level++)postMessage('CFO · '+(['','reserve below target','urgent cash warning','critical cash warning'][level]),

  else if(!band&&f.boardBand)postMessage('Board · reserve restored','Cash after planned payments is back above £17m. Keep checking upcoming payments before expanding.','financing','board-reserve');
  f.boardBand=band;
 }
}

function developmentHas(id){return career().unlocked.includes(id);}
function controlBuilding(){return state.assets.find(a=>a.type==='Office'&&operating(a));}
function planningOfficeUpgrade(){
 if(!developmentHas('office'))return '';
 return '<article><h3>Planning Office</h3><p>Upgrade your operating control building to house the development team.</p>'+
 (career().planningOffice?'<p class="good">Upgrade complete</p>':controlBuilding()?
 btn('Upgrade to Planning Office','develop-install-office','primary'):'<p class="bad">Requires an operating control building</p>')+'</article>';
}
function scenarioRequirements(id){
 const requirements={
  battery:()=>[['Battery operations unlocked, or a battery already operating',developmentHas('storage')||finance().tutorialSkipped||state.assets.some(a=>a.type==='Battery'&&operating(a))]],
  grid:()=>[['Grid engineering unlocked, or a connection of at least 120 MW',developmentHas('grid')||gridMW()>=120]],
  expansion:()=>[['Estate planning unlocked',developmentHas('land')]]
 };
 return requirements[id]?.()||[];
}
function tutorialFinished(){return !finance().winter||finance().winter.status==='complete';}
function tutorialGate(action){
 const w=finance().winter;
 if(!w||tutorialFinished())return '';
 const lesson=w.status==='tutorial'?w.lesson:-1;
 const minimum={
  'tab-build':2,'tab-capital':2,'tab-heavy':2,'tab-dispatch':0,'tab-plant':4,'tab-capacity':5,'tab-report':7,
  'tab-advisors':4,'tab-financing':2,'tab-costs':7,'tab-development':8,'tab-scenarios':8,
  'build-Battery':2,'build-OCGT':8,'auction-65':5,'book-service':4,'bank-borrow':2,'site-remove':8,'site-land':8,'upgrade':8
 }[action]??(action.startsWith('build-')?2:undefined);
 return minimum!==undefined&&lesson<minimum?'Available later in Winter Peak. Continue the tutorial or choose Skip tutorial.':'';
}
function boardApproval(){
 return Math.min(100,Math.max(0,Math.round(65+(reserveCash()-17)*3+career().completed.length*4+(career().communityApproval?4:0)+Math.sign(state.daily.profit)*5)));
}
function careerSummary(){
 const c=career();
 return row('CEO level',1+Math.floor(c.completed.length/2))+row('Board approval',boardApproval()+'%')+row('Development tokens',c.tokens)+
 '<details><summary>How to earn tokens and improve approval</summary><p>Finish all eight steps of a story assignment and select Report to the board at the debrief to earn one token. Each assignment pays once. Spend tokens in Development. Your CEO level rises after every two completed assignments.</p><p>Board approval starts from 65%. Each £1m of cash after commitments above the £17m target adds 3 points, and a shortfall subtracts 3 points per £1m. Each completed assignment adds 4 points. Today’s operating profit adds 5 points if positive or subtracts 5 if negative. Hosting a community open day adds 4 points once.</p></details>';
}
function showDevelopment(){
 const c=career(),office=controlBuilding();
 return '<h2>Development tree</h2><p>Complete story assignments to earn tokens. An operating control building houses your development team.</p>'+careerSummary()+
 developmentNodes.map(([id,name,cost,scenarios,description,parent])=>{
  const unlocked=developmentHas(id);
  const available=office&&tutorialFinished()&&c.tokens>=cost&&c.completed.length>=scenarios&&(!parent||developmentHas(parent)&&c.planningOffice);
  return '<article class="notice"><h3>'+name+'</h3><p>'+description+'</p><p>'+cost+' token · '+scenarios+' completed assignment'+(scenarios===1?'':'s')+(parent?' · Planning office':'')+'</p>'+
  (unlocked?'<p>Unlocked</p>':available?btn('Unlock','develop-'+id):'<p>Requirements still to meet</p>')+
  (id==='office'&&unlocked&&!c.planningOffice?btn('Open Upgrades & land','tab-capital'):'')+'</article>';
 }).join('');
}
function storyChapters(story){
 const [id,,advisor,brief,goal,check,advice]=story;
 const delivery={
  'first-profit':['tab-dispatch','Open trading plan'],
  'healthy-plant':['tab-plant','Review maintenance'],
  reserve:['tab-financing','Review financing'],
  team:['tab-build','Open Build'],
  battery:['tab-capital','Review battery investment'],
  grid:['tab-capital','Review transformer upgrades'],
  contract:['tab-capacity','Open capacity auction'],
  expansion:['tab-capital','Review land options']
 }[id];
 return [
  ['Board briefing',advisor,brief,'Accept the board’s brief.'],
  ['Check the books','CFO','We need a clear view of what is already committed before taking on more.','Review the Financing page.',a=>a.visited?.financing,'tab-financing','Review financing'],
  ['Inspect the site','Grid Director','Power sales depend on both the electrical connection and enough fuel reaching the turbines.','Review Plant operations.',a=>a.visited?.plant,'tab-plant','Review plant operations'],
  ['Review the trading plan','Trading Director','The next decision is when to run. Check prices and see which hours your current plan uses.','Open the trading plan.',a=>a.visited?.dispatch,'tab-dispatch','Open trading plan'],
  ['Choose your approach',advisor,advice,'Confirm your approach before taking action.'],
  ['Deliver the assignment',advisor,'Put your plan into practice and report back once the target is met.',goal,check,...delivery],
  ['Check the outcome','CFO','The target tells us what you achieved. The quarterly results show what it cost and how the wider business performed.','Review the quarterly results.',a=>a.visited?.report,'tab-report','Open quarterly results'],
  ['Board debrief','Board Chair','Bring us the outcome and what you learned. We’ll record the assignment and fund your next development decision.','Report to the board.']
 ];
}
function currentStoryChapter(story,active){return storyChapters(story)[active.chapter??5]||storyChapters(story)[0];}
function activeStoryObjective(){
 const active=finance().career?.active;
 const story=active&&stories.find(entry=>entry[0]===active.id);
 if(!story)return '';
 const chapter=currentStoryChapter(story,active);
 return story[1]+' · '+((active.chapter??5)+1)+'/8 · '+chapter[0];
}
function showActiveStory(){
 const active=career().active;
 const story=active&&stories.find(entry=>entry[0]===active.id);
 if(!story)return '<h2>Scenarios</h2>'+btn('Choose a scenario','tab-scenarios','primary');
 const [title,advisor,brief,goal,check,route,label]=currentStoryChapter(story,active);
 const chapter=active.chapter??5;
 const ready=!check||check(active);
 const directors=['Operations Director','Trading Director','Business Development Director','Grid Director','CFO','Commercial Director'];
 const director=directors.indexOf(advisor);
 const speaker=director>=0?portrait(advisor,director,3,2):'';
 return '<div class="desk-heading"><small>'+story[1]+' · STEP '+(chapter+1)+' OF 8</small><h2>'+title+'</h2></div>'+
 '<div class="advisor-list tutorial-advisor"><article'+(speaker?'':' class="advisor-without-portrait"')+'>'+speaker+'<div><h3>'+advisor+'</h3><p>'+brief+'</p></div></article></div>'+
 row('Objective',goal)+
 '<div class="desk-actions">'+(ready?btn(chapter===7?'Report to the board':chapter===0?'Accept briefing':'Next step','story-claim','primary'):
 btn(label,route,'primary'))+btn('Return to site','close')+'</div>'+
 (ready?'':'<p class="desk-note">Return to this briefing from the scenario card on the map.</p>')+
 '<div class="desk-actions">'+btn('Leave assignment','story-leave')+'</div>';
}
function showScenarios(){
 const c=career(),f=finance(),winter=tutorialState();
 const tutorial=winter?.status==='complete'?
  '<article class="notice"><h3>Winter Peak tutorial</h3><p>'+(f.tutorialSkipped?'Skipped':'Completed')+'</p></article>':'';
 const officeReady=developmentHas('office');
 const officeStatus=c.planningOffice?'Upgrade complete':officeReady?'Upgrade unlocked · open Upgrades & land':'Unlock in Development after completing one assignment and earning one token. Requires an operating control building.';
 const office='<article class="notice"><h3>Planning Office</h3><p class="'+(officeReady?'good':'bad')+'">'+officeStatus+'</p>'+
 (c.planningOffice?'':officeReady?btn('Open Upgrades & land','tab-capital'):btn('Open Development','tab-development'))+'</article>';
 return '<h2>Scenarios</h2><p>Choose an assignment, then open its briefing from the site map.</p>'+tutorial+office+
 stories.map(([id,title,,,goal])=>{
  const active=c.active?.id===id,done=c.completed.includes(id);
  const requirements=scenarioRequirements(id);
  const met=requirements.every(([,ready])=>ready);
  const available=met&&!c.active&&!done;
  const status=done?'Completed':active?'Active · continue from the site map':available?'Available':met?'Unavailable · another assignment is active':'Unavailable · requirements unmet';
  return '<article class="notice"><h3>'+title+'</h3><p>Objective · '+goal+'</p>'+
  (requirements.length?requirements.map(([label,ready])=>'<p class="'+(ready?'good':'bad')+'">'+(ready?'Met · ':'Unmet · ')+label+'</p>').join(''):'<p class="good">No additional entry requirements</p>')+
  '<p class="'+(available||done||active?'good':'bad')+'">'+status+'</p>'+
  (available?btn('Select scenario','story-start-'+id):'')+'</article>';
 }).join('');
}
const inboxStories=[
 ['Local flexibility trial','Trading Director','A local network trial needs a partner. Join for a £25,000 participation payment, or pass.','Join trial',.025],
 ['Supplier rebate','CFO','Our supplier is offering a £15,000 rebate. Accept it before the offer closes.','Accept rebate',.015],
 ['Flood warning','Operations Director','Heavy rain is forecast. Temporary barriers cost £12,000. Waiting could mean a £25,000 cleanup.','Pay for barriers',-.012],
 ['Spare parts shortage','Operations Director','A supplier warns that parts may be delayed. Reserve stock for £8,000 to avoid a possible £18,000 rush order.','Reserve parts',-.008],
 ['Training grant','Business Development Director','A local training programme can reimburse £20,000 of site costs.','Accept grant',.020],
 ['Community open day','CEO office','The council wants a site visit. Hosting costs £5,000 and improves the board’s view of our local relationships.','Host visit',-.005]
];
const regionalEventTemplates=[
 ['Flexible demand trial','Trading Director','A local customer will pay for a trial of flexible electricity use.', 'Accept trial',.016],
 ['Metering correction','CFO','The metering supplier has offered a credit after reviewing past invoices.','Accept credit',.011],
 ['Skills partnership','Operations Director','A college will contribute to the cost of hosting site training.', 'Accept contribution',.012],
 ['Grid data study','Grid Director','The network operator will pay for anonymised operating data in a planning study.', 'Join study',.014],
 ['Supplier recycling scheme','Business Development Director','A recycler will pay for eligible spare materials from the site.', 'Accept offer',.009],
 ['Shared storage study','Commercial Director','A partner will fund a study of shared battery access.', 'Accept funding',.018],
 ['Local innovation grant','Business Development Director','A regional fund is offering a small grant toward site improvements.', 'Accept grant',.020],
 ['Insurance adjustment','CFO','The insurer has offered a credit following a review.', 'Accept credit',.010],
 ['Operator workshop','Operations Director','A neighbouring operator will pay Meridian to host a workshop.', 'Host workshop',.013],
 ['Power market study','Trading Director','A university can pay for access to anonymised trading data.', 'Join study',.008],
 ['Storm inspection','Operations Director','Heavy winds are forecast. A precautionary inspection could avoid a larger call-out bill.', 'Book inspection',-.009,.5,.018],
 ['Drainage blockage','Operations Director','A drainage check found a blockage. Early clearance is cheaper than an emergency call-out.', 'Clear drains',-.010,.55,.021],
 ['Supplier delay','Operations Director','A supplier reports a delivery delay. Reserve alternate transport to limit rush fees.', 'Reserve transport',-.007,.5,.016],
 ['Survey dispute','Business Development Director','A boundary query could require urgent survey work. Booking early reduces the cost.', 'Book survey',-.006,.5,.015],
 ['Grid telemetry fault','Grid Director','A communications link is intermittent. A planned repair may avoid a larger call-out.', 'Arrange repair',-.008,.55,.020],
 ['Short-notice audit','CFO','Records need checking. A scheduled review may avoid expensive last-minute support.', 'Book review',-.007,.5,.016],
 ['Security lighting fault','Operations Director','A lighting circuit has failed. Repair now or risk an emergency visit.', 'Repair lighting',-.006,.5,.014],
 ['Plant wash-water leak','Operations Director','A minor leak can be repaired now to reduce the risk of a cleanup bill.', 'Repair leak',-.008,.5,.019],
 ['Access road washout','Business Development Director','Rain may damage the approach road. A planned repair is cheaper than emergency work.', 'Prepare repairs',-.009,.5,.022]
];
const eventDistricts=['Trent Valley','Derbyshire','Nottinghamshire','Leicestershire','Lincolnshire'];
for(let index=0;inboxStories.length<100;index++){
 const [title,advisor,brief,label,value,risk,loss]=regionalEventTemplates[index%regionalEventTemplates.length];
 const district=Math.floor(index/regionalEventTemplates.length),scale=1+district*.15;
 const amount=Math.round(value*scale*1000)/1000;
 const downside=loss?Math.round(loss*scale*1000)/1000:0;
 inboxStories.push([title+' · '+eventDistricts[district],advisor,brief+' '+(amount>=0?'Payment '+money(amount)+'.':
  'Cost '+money(-amount)+'. Declining has a '+Math.round(risk*100)+'% chance of costing '+money(downside)+'.'),label,amount,risk,downside]);
}
function tickInboxStories(){
 if(!hasChosenCEO()||needsDifficulty()||!tutorialFinished()||finance().dismissed)return;
 const c=career(),interval={often:8,normal:20,rare:45}[c.frequency];
 if(c.event&&state.day>=c.event.expires){delete c.event;finance().messages=inbox().filter(m=>m.key!=='career-event');}
 if(!interval||c.event||state.day<c.lastEvent+interval)return;
 const struggling=reserveCash()<17||state.cash<5;
 const choices=inboxStories.flatMap((event,i)=>struggling&&event[4]<=0?[]:[i]);
 const fresh=choices.filter(i=>!(c.recentEvents||[]).includes(i));
 const pool=fresh.length?fresh:choices;
 const index=pool[Math.floor(Math.random()*pool.length)];
 c.recentEvents=[...(c.recentEvents||[]),index].slice(-10);
 const [title,advisor,brief]=inboxStories[index];
 c.lastEvent=state.day;c.event={index,expires:state.day+5};
 postMessage(title,advisor+' · '+brief+' Respond before day '+c.event.expires+'.','messages','career-event');
 save(false);
}
function careerAction(action){
 const c=career();
 uiDirty=true;
 if(action==='skip-winter'){
  const w=finance().winter;
  if(w?.status==='live'){const a=state.assets.find(a=>a.id===w.asset);if(a){a.dispatchMode=w.oldMode;a.plan=w.oldPlan;}}
  if(w)w.status='complete';
  finance().tutorialSkipped=true;
  finance().complete=true;deskTab='overview';return;
 }
 if(action.startsWith('event-frequency-')){const mode=action.slice(16);c.frequency=mode;c.lastEvent=state.day;return;}
 if(action==='career-accept'||action==='career-decline'){
  if(!c.event)return 'This decision has expired.';
  const index=c.event.index,event=inboxStories[index];
  const amount=action==='career-accept'?event[4]:Math.random()<(event[5]||([2,3].includes(index)?.5:0))?-(event[6]||(index===2?.025:.018)):0;
  if(amount<0&&state.cash+amount<1.05&&action==='career-accept')return 'Keep your cash for essential payments. You can decline this offer.';
  const change=amount<0?Math.max(amount,-Math.max(0,state.cash-1.05)):amount;
  state.cash+=change;
  if(action==='career-accept'&&index===5)c.communityApproval=true;
  delete c.event;
  postMessage(event[0]+' · outcome',change?money(Math.abs(change))+(change>0?' received.':' paid.'):'No payment was needed.','overview','career-event');
  uiDirty=true;return;
 }
 if(!tutorialFinished())return 'Finish or skip Winter Peak first.';
 if(action==='develop-install-office'){
  if(!developmentHas('office')||!controlBuilding())return 'Unlock the Planning Office and have an operating control building first.';
  c.planningOffice=true;
  return;
 }
 if(action==='story-leave'){delete c.active;deskTab='scenarios';return;}
 if(action==='story-claim'){
  const story=stories.find(s=>s[0]===c.active?.id);
  if(!story)return 'Start an assignment first.';
  const check=currentStoryChapter(story,c.active)[4];
  if(check&&!check(c.active))return 'Complete this step first.';
  const chapter=c.active.chapter??5;
  if(chapter<7){c.active.chapter=chapter+1;c.active.visited={};return;}
  c.completed.push(story[0]);c.tokens++;delete c.active;deskTab='scenarios';
  postMessage('Board · assignment complete','You completed '+story[1]+' and earned one development token.','development');return;
 }
 if(action.startsWith('story-start-')){
  const id=action.slice(12);
  if(!scenarioRequirements(id).every(([,ready])=>ready))return 'Meet the scenario entry requirements first.';
  if(!c.active&&!c.completed.includes(id)&&stories.some(s=>s[0]===id)){c.active={id,chapter:0,visited:{},profit:state.profit,land:state.owned.length};desk.close();}
  uiDirty=true;
  return;
 }
 const node=developmentNodes.find(n=>n[0]===action.slice(8));
 if(!node)return;
 const [id,,cost,required,,parent]=node;
 if(developmentHas(id)||c.tokens<cost||c.completed.length<required||(parent&&(!developmentHas(parent)||!c.planningOffice))||!controlBuilding())return 'Meet the development requirements first.';
 c.tokens-=cost;c.unlocked.push(id);
}

refresh();requestAnimationFrame(loop);
if(finance().dismissed){state.paused=true;openDesk('dismissed');}else if(!hasChosenCEO()||needsDifficulty()){openDesk('campaign');save(false);}
</script></body></html>
